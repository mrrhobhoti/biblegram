E({id:'job',cat:'beg',t:'Job’s Storm',ref:'Job 1–2; 38–42',era:'Patriarchal setting',series:'Wisdom',v:'The LORD gave, and the LORD hath taken away; blessed be the name of the LORD.',vr:'Job 1:21',s:'Job is the most upright man on earth, and in one day he loses his children, wealth and health. His friends insist he must have sinned. Job pleads for God to answer him. God finally speaks from a whirlwind, not with explanations but with questions about creation, and Job is humbled and restored.',h:['Job lived in “the land of Uz,” which Lamentations 4:21 links with Edom, south-east of the Dead Sea.','God’s answer (chapters 38–41) never tells Job about the heavenly scene in chapter 1.','Ezekiel 14:14 names Job alongside Noah and Daniel as famously righteous men.'],q:{q:'How did God speak to Job?',o:['In a dream','From a whirlwind','Through a prophet'],a:1}}),
E({id:'rock',cat:'exo',hid:1,t:'Moses Strikes the Rock',ref:'Numbers 20:1–13',era:'Wilderness years',series:'Exodus',v:'Because ye believed me not… ye shall not bring this congregation into the land.',vr:'Numbers 20:12',s:'Israel is thirsty and complaining again at Kadesh. God tells Moses to speak to a rock. Instead, worn out and angry, Moses strikes it twice: “Must we fetch you water?” Water gushes out, but the cost is huge. Moses will not enter the Promised Land.',h:['Earlier, in Exodus 17, God had told Moses to strike a rock. This time the command was to speak to it.','The chapter opens with the death of Moses’ sister Miriam (20:1), so grief may lie behind his outburst.','Paul later wrote that “that Rock was Christ” (1 Corinthians 10:4).'],q:{q:'What did God tell Moses to do to the rock?',o:['Strike it','Speak to it','Pour oil on it'],a:1}}),
E({id:'gibeon',cat:'exo',hid:1,t:'The Gibeonite Trick',ref:'Joshua 9',era:'c. 1400–1200 BC',series:'Conquest',v:'And asked not counsel at the mouth of the LORD.',vr:'Joshua 9:14',s:'The people of Gibeon, a nearby city, fear Israel. They put on worn-out sandals, carry mouldy bread and pretend to come from a far country. Israel’s leaders make a peace treaty without praying. Three days later they discover the trick, but they keep their word.',h:['Their “evidence” was dry, mouldy bread, torn wineskins and patched sandals (9:5).','Centuries later Saul broke this treaty, which led to the famine in Rizpah’s story (2 Samuel 21).','Gibeon has been excavated at el-Jib, where a huge rock-cut pool was found (compare 2 Samuel 2:13).'],q:{q:'What did Israel’s leaders forget to do?',o:['Count the men','Ask the LORD','Check their sandals'],a:1}}),
E({id:'sun',cat:'exo',hid:1,t:'The Day the Sun Stood Still',ref:'Joshua 10',era:'c. 1400–1200 BC',series:'Conquest',v:'So the sun stood still in the midst of heaven.',vr:'Joshua 10:13',s:'Five kings attack Gibeon for making peace with Israel. Joshua marches all night to defend them. In the battle he prays out loud, “Sun, stand thou still upon Gibeon,” and the day is lengthened until the victory is won.',h:['The verse quotes “the book of Jasher” (10:13), an ancient book that has since been lost.','Hailstones killed more of the enemy than the swords did (10:11).','The text says there was no day like it before or after, “that the LORD hearkened unto the voice of a man” (10:14).'],q:{q:'Which city was Joshua defending?',o:['Jericho','Gibeon','Ai'],a:1}}),
E({id:'samuel3',cat:'kng',t:'The Voice in the Night',ref:'1 Samuel 3',era:'c. 1080 BC',series:'Road to the throne',v:'Speak; for thy servant heareth.',vr:'1 Samuel 3:10',s:'Young Samuel sleeps in the tabernacle. A voice calls his name three times, and three times he runs to old Eli. Eli realises it is God and tells him how to answer. The message is hard: judgment is coming on Eli’s corrupt house.',h:['“The word of the LORD was precious in those days; there was no open vision” (3:1). God rarely spoke then.','Samuel was sleeping near the ark of God (3:3).','Eli’s sons were stealing from the sacrifices and abusing their position (2:12–17).'],q:{q:'How many times did Samuel run to Eli before answering God?',o:['Once','Three times','Seven times'],a:1}}),
E({id:'jonathan',cat:'kng',hid:1,t:'Two Men vs. an Army',ref:'1 Samuel 14',era:'c. 1030 BC',series:'Road to the throne',v:'For there is no restraint to the LORD to save by many or by few.',vr:'1 Samuel 14:6',s:'Israel’s army is frozen with fear. Prince Jonathan and his armour-bearer quietly climb a cliff to a Philistine outpost, just the two of them. They kill about twenty men, panic spreads, an earthquake hits, and the whole Philistine army collapses.',h:['The pass at Michmash had two rocky crags named Bozez and Seneh (14:4).','Israel had almost no swords because the Philistines controlled ironworking (13:19–22).','A popular story says a British officer in 1918 used this chapter to find a route around Turkish positions at Michmash.'],q:{q:'Who went with Jonathan?',o:['David','His armour-bearer','Saul'],a:1}}),
E({id:'jehoshaphat',cat:'kng',hid:1,t:'The Choir That Led the Army',ref:'2 Chronicles 20',era:'c. 853 BC',series:'Kings of Judah',v:'For the battle is not yours, but God’s.',vr:'2 Chronicles 20:15',s:'A huge allied army marches against Judah. King Jehoshaphat admits, “We do not know what to do, but our eyes are on you.” God says the battle is his. The next day, singers march in front of the army praising God, and the enemy armies turn on each other.',h:['The singers led the troops into the field (20:21).','The allied armies of Ammon, Moab and Mount Seir destroyed one another (20:23).','It took three days to collect the spoil, and the place was named the Valley of Berachah, “blessing” (20:25–26).'],q:{q:'Who went in front of the army?',o:['Archers','Singers','Priests with the ark'],a:1}}),
E({id:'joash',cat:'kng',hid:1,t:'The Hidden Prince',ref:'2 Kings 11',era:'c. 841–835 BC',series:'Kings of Judah',v:'And he was with her hid in the house of the LORD six years.',vr:'2 Kings 11:3',s:'When her son the king dies, Queen Athaliah murders the entire royal family so she can rule. Baby prince Joash is snatched away by his aunt and hidden in the temple for six years. When he turns seven, the priest Jehoiada crowns him in a surprise coup.',h:['Athaliah came from the family of Ahab, the northern king, and is the only queen who ruled Judah alone.','Joash’s aunt Jehosheba was married to the high priest Jehoiada (2 Chronicles 22:11).','If the plot had succeeded, David’s royal line would have ended. One hidden baby kept it alive.'],q:{q:'Where was baby Joash hidden?',o:['In Egypt','In the temple','In a cave'],a:1}}),
E({id:'isaiah',cat:'pro',t:'“Here Am I; Send Me”',ref:'Isaiah 6',era:'c. 740 BC',series:'Prophets',v:'Here am I; send me.',vr:'Isaiah 6:8',s:'In the year King Uzziah dies, Isaiah sees the Lord on a high throne. Six-winged seraphim cry, “Holy, holy, holy.” Isaiah is undone by his own sin, until a seraph touches his lips with a burning coal. God asks, “Whom shall I send?” Isaiah answers.',h:['Seraphim means “burning ones.”','The Great Isaiah Scroll, among the Dead Sea Scrolls and from about 125 BC, contains almost the whole book.','John 12:41 says Isaiah “saw his glory,” the glory of Jesus.'],q:{q:'What touched Isaiah’s lips?',o:['Water','A burning coal','Oil'],a:1}}),
E({id:'jeremiahfield',cat:'exi',hid:1,t:'Buying a Field in a War Zone',ref:'Jeremiah 32',era:'587 BC',series:'Exile & return',v:'Is there any thing too hard for me?',vr:'Jeremiah 32:27',s:'Babylon’s army surrounds Jerusalem, and Jeremiah is in prison. God tells him to buy his cousin’s field, land that is about to be conquered. It looks like madness. Jeremiah signs the deed in front of witnesses as a sign that people will one day buy fields here again.',h:['He paid 17 shekels of silver to his cousin Hanamel (32:9).','The deeds were sealed in a clay jar “that they may continue many days” (32:14), the same way the Dead Sea Scrolls survived.','His scribe was Baruch son of Neriah. A clay seal with that name has surfaced, though its authenticity is debated.'],q:{q:'What did Jeremiah buy?',o:['A house','A field','A vineyard'],a:1}}),
E({id:'well',cat:'jes',t:'The Woman at the Well',ref:'John 4',era:'c. AD 28',series:'Life of Jesus',v:'Whosoever drinketh of the water that I shall give him shall never thirst.',vr:'John 4:14',s:'At noon, Jesus sits by a well in Samaria and asks a woman for a drink, breaking two taboos at once. He offers her “living water” and tells her about her five husbands. She runs back to town: “Come, see a man which told me all things that ever I did.”',h:['Jacob’s Well near ancient Sychar can still be visited and is about 40 m deep.','Women usually drew water in the cool of the day. Coming at noon may mean she was avoiding people.','Many from her town believed because of her testimony (4:39).'],q:{q:'What did Jesus offer the woman?',o:['Bread','Living water','Healing'],a:1}}),
E({id:'nicodemus',cat:'jes',t:'A Visitor by Night',ref:'John 3; 19',era:'c. AD 28',series:'Life of Jesus',v:'For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.',vr:'John 3:16',s:'Nicodemus, a respected Pharisee, visits Jesus secretly at night. Jesus tells him he must be “born again.” Nicodemus is baffled. Years later, after the crucifixion, he openly brings a huge load of spices to bury Jesus.',h:['He was a ruler of the Jews, a member of the Sanhedrin council (3:1).','He brought about 100 Roman pounds of myrrh and aloes, roughly 33 kg, a royal amount (19:39).','John 3:16 is part of this night-time conversation.'],q:{q:'When did Nicodemus first visit Jesus?',o:['At dawn','At night','At a feast'],a:1}}),
E({id:'hem',cat:'jes',t:'Twelve Years and One Touch',ref:'Mark 5:25–34',era:'c. AD 29',series:'Life of Jesus',v:'Daughter, thy faith hath made thee whole.',vr:'Mark 5:34',s:'A woman has been bleeding for twelve years and has spent everything on doctors. In a crushing crowd, she touches the edge of Jesus’ cloak and is healed instantly. Jesus stops: “Who touched me?” Trembling, she confesses, and he calls her “Daughter.”',h:['Her condition made her ritually unclean (Leviticus 15:25), cut off from worship and touch for twelve years.','She probably touched the tassels on his garment, which the law told Jewish men to wear (Numbers 15:38).','Her story is set inside the story of Jairus’ 12-year-old daughter: twelve years of suffering, twelve years of life.'],q:{q:'What did Jesus call the woman?',o:['Sister','Daughter','Friend'],a:1}}),
E({id:'thomas',cat:'jes',t:'Doubting Thomas',ref:'John 20:24–29',era:'c. AD 30–33',series:'Life of Jesus',v:'Blessed are they that have not seen, and yet have believed.',vr:'John 20:29',s:'Thomas wasn’t there when the risen Jesus appeared. “Unless I put my finger in the nail marks, I will not believe.” A week later Jesus appears again and invites him to touch. Thomas makes the highest confession in the Gospels: “My Lord and my God.”',h:['Earlier, Thomas had bravely said, “Let us also go, that we may die with him” (11:16).','“My Lord and my God” (20:28) is one of the clearest statements of Jesus’ divinity in the New Testament.','Tradition says Thomas took the gospel to India, and the Mar Thoma Christians of Kerala trace their church to him.'],q:{q:'What did Thomas say when he saw Jesus?',o:['“Rabbi!”','“My Lord and my God”','“Forgive me”'],a:1}}),
E({id:'peter',cat:'jes',t:'Breakfast on the Beach',ref:'John 18; 21',era:'c. AD 30–33',series:'Life of Jesus',v:'Lord, thou knowest all things; thou knowest that I love thee.',vr:'John 21:17',s:'Peter denied Jesus three times beside a charcoal fire. After the resurrection, the disciples fish all night and catch nothing, until a stranger on the shore tells them where to cast. It is Jesus, cooking breakfast on another charcoal fire. Three times he asks Peter, “Do you love me?”',h:['The Greek word for “charcoal fire” appears only twice in the New Testament: at the denial (18:18) and at the restoration (21:9).','They caught exactly 153 large fish, and the net didn’t break (21:11).','Early church tradition says Peter was crucified in Rome under Nero.'],q:{q:'How many times did Jesus ask Peter if he loved him?',o:['Once','Three times','Seven times'],a:1}}),
E({id:'ethiopian',cat:'chu',hid:1,t:'The Ethiopian on the Desert Road',ref:'Acts 8:26–40',era:'c. AD 33',series:'Early Church',v:'Understandest thou what thou readest?',vr:'Acts 8:30',s:'An angel sends Philip to a desert road. There an African official, treasurer to the queen of Ethiopia, is riding home reading Isaiah aloud. Philip runs alongside his chariot and explains that the passage is about Jesus. At the next water they find, the man is baptised.',h:['Candace was the title of the queen mother of Kush, the kingdom of Meroë in modern Sudan.','He was reading Isaiah 53, the “suffering servant” passage.','Ethiopian Christians have long honoured him, and the Ethiopian kingdom of Aksum became officially Christian in the 300s.'],q:{q:'What was the Ethiopian reading?',o:['Genesis','Isaiah','Psalms'],a:1}}),
E({id:'eutychus',cat:'chu',hid:1,t:'Asleep in the Sermon',ref:'Acts 20:7–12',era:'c. AD 57',series:'Early Church',v:'As Paul was long preaching, he sunk down with sleep.',vr:'Acts 20:9',s:'Paul preaches until midnight in a crowded upstairs room full of lamps. A young man named Eutychus, sitting in the window, drifts off and falls three storeys to his death. Paul runs down, embraces him, and says, “His life is in him.” Then he goes back up and keeps preaching until dawn.',h:['It happened in Troas, a port in north-west Turkey.','“There were many lights” (20:8). Oil lamps would make a packed room hot and stuffy.','Eutychus means “lucky.”'],q:{q:'Why did Eutychus fall?',o:['He was pushed','He fell asleep','The floor broke'],a:1}}),
E({id:'shipwreck',cat:'chu',hid:1,t:'Shipwrecked and Snakebitten',ref:'Acts 27–28',era:'c. AD 60',series:'Early Church',v:'And he shook off the beast into the fire, and felt no harm.',vr:'Acts 28:5',s:'A prisoner on his way to Rome, Paul warns the crew not to sail, and they ignore him. After two weeks lost in a storm, the ship breaks apart off Malta, yet all 276 people reach shore. While building a fire, Paul is bitten by a viper, shakes it off, and is unharmed.',h:['There were 276 people on board (27:37).','St Paul’s Bay in Malta is the traditional site of the wreck.','Luke writes “we,” which suggests he was on board. An 1848 study by the sailor James Smith praised the accuracy of its nautical details.'],q:{q:'Where was Paul shipwrecked?',o:['Crete','Malta','Cyprus'],a:1}})
);
// series (episodes) and cliffhanger hooks
const SERIES={joseph:['joseph1','joseph2','joseph3','joseph4','joseph'],david:['david1','david','david3','david4','david5'],elijah:['elijah1','zarephath','elijah','elijah4'],esther:['esther1','esther','esther3','esther4']};
const SNAME={joseph:'The Joseph saga',david:'The David saga',elijah:'The Elijah saga',esther:'The Esther saga'};
const HOOK={joseph1:'Sold to traders, Joseph is dragged to Egypt in chains. What happens to a slave who refuses to give in?',joseph2:'Two years forgotten in prison. Then Pharaoh has a nightmare no one can explain…',joseph3:'Seven years later the famine hits Canaan, and ten familiar faces walk into Joseph’s hall.',joseph4:'Judah offers himself as a slave. Joseph can’t hold it in any longer…',david1:'The boy with oil still on his head is about to face a nine-foot giant.',david:'The giant is dead. Now King Saul is jealous, and he wants David dead too.',david3:'David finally takes the throne. Then one evening, from the palace roof, he sees a woman bathing…',david4:'God forgives David, but the sword will never leave his house. His own son is coming for the throne.',elijah1:'The brook dries up. God sends Elijah into enemy territory, to a starving widow.',zarephath:'Three years without rain. Now Elijah challenges 450 prophets of Baal to a showdown.',elijah:'Elijah’s work is almost done. A whirlwind is coming, and Elisha refuses to leave his side.',esther1:'The new queen has a secret, and a powerful man is about to plot genocide against her people.',esther:'Esther invites the king and Haman to dinner. That night, the king can’t sleep…',esther3:'At Esther’s second banquet, she finally names her enemy.'};
Object.entries(SERIES).forEach(([k,ids])=>ids.forEach((id,i)=>Object.assign(byIdRaw(id),{sr:k,ep:i+1,eps:ids.length,series:SNAME[k],hk:HOOK[id]})));

// Theology: [finding, connection to Jesus, NT reference]
const TH={
creation:['Many scholars read Genesis 1 as God building a cosmic temple: six days of ordering and filling, then God “rests” as a king enthroned. Humans are placed in it as his “image,” the word used for a king’s statue that marked his rule.','John opens his Gospel with “In the beginning was the Word,” presenting Jesus as the one through whom all things were made.','John 1:1–3'],
enoch:['In a chapter where death is the refrain, Enoch shows that “walking with God” is a relationship, not just religion. Hebrews draws the lesson that without faith it is impossible to please God.','Enoch’s escape from death previews the hope that in Christ “we shall not all sleep.”','1 Corinthians 15:51'],
noah:['The flood is pictured as creation running backwards, with the waters of Genesis 1 returning, then a new creation. God’s covenant afterwards is made with every living creature, the first covenant in Scripture.','Peter compares the ark to baptism: passing through judgment to safety in Christ.','1 Peter 3:20–21'],
babel:['Babel is humanity trying to reach heaven and make a name for itself. In the very next chapter God promises Abraham, “I will make thy name great.” What people grasp at, God gives as a gift.','At Pentecost the curse of Babel is reversed: many languages, one message understood.','Acts 2:5–11'],
abraham:['Genesis 15:6, “he believed in the LORD; and he counted it to him for righteousness,” becomes the foundation of Paul’s teaching that people are made right with God by faith, not by works.','Paul calls the promise to Abraham “the gospel preached beforehand,” fulfilled in Christ, the true “seed.”','Galatians 3:8, 16'],
melchizedek:['Melchizedek is a priest before Levi, Aaron or the Law even existed, and Abraham, the father of Israel, honours him. Hebrews argues that this kind of priesthood is greater and permanent.','Hebrews presents Jesus as an eternal priest “after the order of Melchizedek,” who also offers bread and wine.','Hebrews 7:1–17'],
hagar:['The first person in Scripture to name God is a foreign, pregnant, runaway slave woman. The God of Abraham cares for those outside the chosen family too.','Jesus repeatedly seeks out the overlooked woman: at the well, in the crowd, at the cross.','John 4:7'],
isaac:['Jewish tradition calls this the Akedah, “the binding.” It answers the question the whole chapter asks, “God will provide,” and it takes place on the mountain where the Temple would later stand.','Christians see the Father offering his only beloved Son on that same ridge, with no ram to take his place.','Romans 8:32; John 1:29'],
jacobwrestle:['Jacob, whose name sounds like “heel-grabber,” has grabbed blessings by trickery all his life. Now he must cling to God alone and comes away limping but blessed. Grace meets him at his weakest.','Paul learned the same lesson: Christ’s power is made perfect in weakness.','2 Corinthians 12:9'],
joseph1:['Theologians call the Joseph story the great example of providence: God works through human sin without approving it. Nothing in the story looks like God is in charge, until the end.','Jesus, too, was rejected by his brothers and sold for silver.','Matthew 26:15'],
joseph2:['“The LORD was with Joseph” is repeated in the worst moments, in slavery and prison (39:2, 21). God’s presence doesn’t mean the absence of suffering.','Jesus was falsely accused, condemned though innocent, and silent before his accusers.','Matthew 26:59–63'],
joseph3:['Joseph refuses credit: “It is not in me.” The famine plan saves Egypt and the surrounding nations, an early glimpse of the promise that through Abraham’s family “all families of the earth” would be blessed.','Like Joseph, Jesus was raised from the lowest place to the right hand of the throne, and the nations come to him for bread.','Philippians 2:8–10'],
joseph4:['As Voddie Baucham and others stress, the real hero of chapters 37–50 is arguably Judah. The brother who sold Joseph becomes the one who offers himself as a substitute, and the royal line comes from Judah (49:10).','Jesus, the Lion of the tribe of Judah, takes the place of the guilty.','Revelation 5:5; 1 Peter 3:18'],
joseph:['Genesis 50:20 is perhaps the clearest statement in Scripture of how God can turn evil acts into saving purposes without excusing them.','The cross is the supreme case: what people meant for evil, God meant for the salvation of many.','Acts 2:23–24'],
tamar:['Genesis 38 sits right inside Joseph’s story to show Judah at his worst, setting up his transformation. Judah’s admission, “She hath been more righteous than I,” is the first crack.','Matthew lists Tamar first among four women in Jesus’ genealogy, all with unexpected stories.','Matthew 1:3'],
lotswife:['Her fault was not curiosity but attachment: her heart was still in Sodom. The story warns against half-hearted rescue.','Jesus used her as a warning about clinging to this life: whoever seeks to save it will lose it.','Luke 17:32–33'],
job:['Job refuses the easy theology of his friends, that suffering always means punishment. God rebukes the friends and says Job spoke rightly (42:7). Faith can include honest lament.','Jesus is the truly innocent sufferer who cried out to God, “Why hast thou forsaken me?”','Matthew 27:46'],
midwives:['“The fear of God” is what made the midwives brave. Fearing God more than Pharaoh freed them from fearing Pharaoh at all.','Another tyrant king, Herod, later tried to kill Hebrew baby boys, and God again preserved the deliverer.','Matthew 2:13–16'],
bush:['God reveals his personal name, YHWH, linked to “I AM.” The bush burns without being consumed: God’s holy presence among his people doesn’t destroy them.','Jesus said, “Before Abraham was, I am,” and his hearers picked up stones because they understood the claim.','John 8:58'],
redsea:['The sea crossing becomes Israel’s defining picture of salvation: God fights, his people are still, and they pass through death-waters to new life.','Paul describes Israel being “baptized unto Moses… in the sea” as a pattern for believers.','1 Corinthians 10:1–2'],
nadab:['Leviticus’ point is that God’s holiness is not casual. Worship is on his terms. The tragedy happens on the very day of celebration to underline that.','Hebrews says Christians can now draw near boldly, not because God is less holy, but because Jesus is the perfect high priest.','Hebrews 10:19–22'],
balaam:['A pagan seer for hire can’t curse whom God has blessed. His oracles even contain the messianic line “there shall come a Star out of Jacob” (Numbers 24:17).','Many have connected Balaam’s star prophecy with the star the eastern magi followed.','Matthew 2:2'],
serpent:['The cure takes the shape of the curse: a snake on a pole. Healing comes not by effort but by looking in trust.','Jesus applied this story directly to his own crucifixion.','John 3:14–15'],
rock:['Moses’ failure shows that even the greatest leader couldn’t bring Israel into rest. The Law, represented by Moses, points beyond itself.','Paul identifies the water-giving rock with Christ, struck once for his people.','1 Corinthians 10:4'],
rahab:['A Canaanite prostitute shows more faith in Israel’s God than many Israelites. The scarlet cord echoes the Passover blood on the doorposts.','She is one of the women in Jesus’ family tree and is honoured in Hebrews’ “hall of faith.”','Matthew 1:5; Hebrews 11:31'],
jericho:['The city falls through worship and obedience, not siege warfare. The marching priests and ark put God, not Israel’s army, at the centre.','Hebrews: “By faith the walls of Jericho fell down.”','Hebrews 11:30'],
achan:['Achan’s story teaches corporate solidarity: one person’s hidden sin affected the whole community. Yet Hosea turns the “Valley of Trouble” into a “door of hope.”','In Christ, one man’s obedience brings blessing to many.','Romans 5:19'],
gibeon:['The leaders’ failure was prayerlessness, not stupidity. Yet God honoured the promise they made in his name, even when it came from a trick.','Jesus taught his followers to be people whose “yes” means yes.','Matthew 5:37'],
sun:['Whether read as poetic language or a literal miracle (Christians have held both views), the text’s emphasis is that God fought for Israel and listened to a human voice.','Jesus also commanded nature: the wind and sea obeyed him.','Mark 4:41'],
ehud:['Judges loves unlikely deliverers: a left-handed man, a woman, the least of a clan. The book shows God using flawed people while the nation spirals downward.','God chooses “the weak things of the world to confound the things which are mighty.”','1 Corinthians 1:27'],
deborah:['Deborah is prophet, judge and military leader at once, and Judges tells it without apology. Jael completes the promise that “a woman” would defeat Sisera, a faint echo of Genesis 3:15, where the woman’s offspring crushes the serpent’s head.','Christ is the promised seed who crushes the enemy’s head.','Romans 16:20'],
gideon:['God reduces the army so that Israel cannot boast. But Gideon’s later life (the golden ephod, 8:27) shows the downward slide of the Judges.','God’s power is shown best when the human odds look hopeless.','2 Corinthians 4:7'],
ruth:['The key Hebrew word is hesed, loyal covenant love. Ruth shows it to Naomi, Boaz shows it to Ruth, and behind it all is God’s hesed. Boaz acts as kinsman-redeemer, the go’el.','Jesus is the greater kinsman-redeemer who became our relative in order to buy us back.','Hebrews 2:14–15; Matthew 1:5'],
jephthah:['Many read Judges as showing Israel becoming like the Canaanites, and a vow that ends in harm to one’s own child is a sign of that slide. The Bible reports it without approving it.','God never asks for a child’s life; instead he gives his own Son.','Romans 8:32'],
samson:['Samson is a mirror of Israel: set apart by God, gifted, yet chasing foreign desires. The book ends with the refrain “every man did that which was right in his own eyes” (21:25).','Samson defeats his enemies most decisively by dying with arms outstretched, a shadow of a greater victory through death.','Colossians 2:15'],
hannah:['Hannah’s song introduces a great theme of Samuel: God reverses fortunes, lifting the poor and humbling the proud, and it mentions God’s “anointed king” before Israel even had one.','Mary’s Magnificat echoes Hannah’s song almost line for line.','Luke 1:46–55'],
samuel3:['In a time when God was silent, the renewal of Israel begins with one listening child. Hearing God is shown as obedience, “Speak; for thy servant heareth,” not just information.','Jesus said, “My sheep hear my voice.”','John 10:27'],
dagon:['The Philistines thought capturing the ark meant beating Israel’s God. The story shows God fighting alone, in enemy territory, without Israel’s help.','Christ, too, entered the enemy’s house and bound the strong man.','Mark 3:27'],
ebenezer:['Ebenezer is about remembering: past help gives faith for future trouble. Notice it says “hitherto,” up to now, not “forever done.”','God who began a good work will carry it on to completion.','Philippians 1:6'],
jonathan:['Jonathan’s faith is simple theology: God can save by many or by few. His bravery contrasts with his father Saul’s fearful paralysis in the same chapter.','Jesus told his disciples that faith as small as a mustard seed can move mountains.','Matthew 17:20'],
david1:['God’s choice of the youngest son continues a pattern in Genesis: Abel, Isaac, Jacob, Joseph, Judah. Grace overturns human ranking.','Jesus, the Son of David, also came from Bethlehem and was “despised and rejected.”','Micah 5:2; Matthew 2:6'],
david:['David’s speech makes the point: the battle is about God’s name, not David’s skill. He fights as Israel’s representative, and his victory counts for the whole nation.','Christ fights as our representative champion, and his victory becomes ours.','1 Corinthians 15:57'],
abigail:['Abigail is a wise peacemaker who takes blame on herself (“upon me let this iniquity be”) to turn away wrath. Wisdom literature would call her the opposite of a fool.','Jesus said, “Blessed are the peacemakers.” He took our blame to turn away God’s wrath.','Matthew 5:9; Romans 5:9'],
david3:['David refuses to seize what God promised by force. He trusts God’s timing, even when given a perfect excuse.','Jesus refused Satan’s offer of the kingdoms of the world, choosing the Father’s way through the cross.','Matthew 4:8–10'],
endor:['The story warns that seeking guidance from the dead is forbidden (Deuteronomy 18:10–12) and fruitless. Saul gets only the same message he already knew.','Believers seek “him that liveth,” not the dead.','Luke 24:5'],
uzzah:['God’s holiness is not a lucky charm to be handled carelessly. David learned that good intentions don’t replace God’s revealed way.','Jesus became the true meeting place between God and people, touchable and full of grace and truth.','John 1:14'],
mephibosheth:['A clear picture of grace: the king seeks out an enemy’s heir, who is lame, afraid and with nothing to offer, “for Jonathan’s sake,” because of a covenant promise.','Believers are welcomed to the King’s table for Christ’s sake.','Ephesians 4:32; Luke 14:21'],
david4:['The Bible doesn’t hide the sins of its heroes. Forgiveness is real, but consequences remain. Psalm 51 shows true repentance: “Against thee, thee only, have I sinned.”','The true Son of David never sinned and took the sin of others on himself.','2 Corinthians 5:21'],
rizpah:['A powerless woman’s silent protest moves a king to do justice. Scripture honours lament and faithful presence when nothing else can be done.','Women stayed watching at the cross when others fled.','Mark 15:40'],
david5:['David’s grief, “would God I had died for thee,” is a wish that a father could take his son’s place. He could not.','The heavenly Father’s Son did die in the place of rebels.','Romans 5:8'],
solomon:['Wisdom in Scripture begins with “the fear of the LORD” and is shown in justice for the vulnerable, like two powerless mothers.','Jesus claimed, “a greater than Solomon is here,” and Paul calls Christ “the wisdom of God.”','Matthew 12:42; 1 Corinthians 1:24'],
jabez:['Spurgeon’s point stands: the blessing worth asking for is God’s blessing “indeed,” which includes being kept from evil, not just gaining more.','Every spiritual blessing is given to believers in Christ.','Ephesians 1:3'],
elijah1:['God provides through the unlikeliest means, unclean birds, and in the wilderness. Elijah must learn dependence before confrontation.','Jesus pointed to the ravens: God feeds them, so do not worry.','Luke 12:24'],
zarephath:['God sends his prophet past every Israelite widow to a foreigner in Baal’s homeland. Jesus’ use of this story nearly got him killed, because it showed God’s mercy reaching the nations.','Jesus raised a widow’s only son at Nain, and the crowd said, “A great prophet is risen.”','Luke 4:25–26; 7:11–16'],
elijah:['Carmel is a contest of gods. Baal was the storm god, yet he could produce neither fire nor rain. Then God meets his exhausted prophet gently, with food, sleep and a whisper.','Jesus also met a burned-out disciple with breakfast and gentleness.','John 21:9–15'],
elijah4:['The handover of Elijah’s cloak shows God’s work outlasting any one servant.','Jesus ascended and poured out his Spirit on his followers, a far greater “double portion.”','Acts 1:9; 2:33'],
naaman:['Grace humbles pride and crosses borders: an enemy general is healed while Israel’s lepers are not. His healing costs nothing, and Gehazi’s attempt to sell grace is punished.','Jesus cited Naaman when he announced good news for outsiders.','Luke 4:27'],
axehead:['God’s power isn’t only for national crises. He cares about a poor student’s borrowed tool and his honesty.','Not a sparrow falls without the Father; the hairs of your head are numbered.','Matthew 10:29–31'],
dothan:['Faith is seeing reality as God sees it. The unseen armies of God were there all along. Elisha then answers enemies with a feast, not a massacre.','Jesus told Peter he could call more than twelve legions of angels, yet he chose the cross.','Matthew 26:53'],
lepers:['The outcasts become the first to discover deliverance and the first messengers. “We do not well” to keep good news to ourselves.','The first witnesses of the resurrection were people the world overlooked.','Matthew 28:8'],
bones:['Even in death, Elisha’s ministry gives life. It shows that the power was God’s, not the prophet’s.','Contact with the dead Jesus brings life: he is the resurrection and the life.','John 11:25'],
jonah:['Jonah is the story of a prophet who knows God is “gracious and merciful” (4:2) and hates it, because the mercy reaches his enemies. The book ends with a question for the reader.','Jesus called his own death and resurrection “the sign of the prophet Jonas.”','Matthew 12:39–41'],
hosea:['Hosea makes covenant personal: idolatry is adultery, and God is a betrayed husband who still pursues. “I will betroth thee unto me for ever” (2:19).','Christ buys back his unfaithful bride, the church, at the cost of himself.','Ephesians 5:25–27'],
isaiah:['Holiness, confession, cleansing, then calling: this is the pattern of Isaiah 6. God cleanses before he commissions.','John says Isaiah saw Jesus’ glory in this vision.','John 12:41'],
hezekiah:['Hezekiah’s prayer, spreading the enemy’s letter before the LORD (19:14), is a model of taking threats directly to God.','In Christ we can bring every anxiety to God in prayer.','Philippians 4:6–7'],
josiah:['Rediscovering God’s word sparks renewal. Josiah’s reform shows that the Bible lost in the temple can mean a nation lost in idolatry.','Jesus opened the Scriptures to his disciples, and their hearts burned.','Luke 24:32'],
jehoshaphat:['Praise as warfare: Judah’s faith is shown by singing before the victory. The king’s prayer, “our eyes are upon thee,” is a model of honest dependence.','Paul and Silas sang hymns in prison at midnight, and doors flew open.','Acts 16:25–26'],
joash:['God’s promise of an everlasting throne to David (2 Samuel 7) nearly ended in one massacre. A hidden child kept the line, and the promise, alive.','Another child of David’s line was hidden from a murderous ruler, in Egypt.','Matthew 2:13–15'],
ebedmelech:['While Judah’s leaders silenced the prophet, a foreign servant showed courage and compassion. God noticed and promised his life, “because thou hast put thy trust in me.”','The gospel reached another Ethiopian official on a desert road.','Acts 8:27'],
jeremiahfield:['Faith invests in God’s promises when circumstances say otherwise. The deed in a jar is hope you can hold.','Abraham “staggered not at the promise of God through unbelief.”','Romans 4:20'],
drybones:['The vision promises national restoration, but its language of graves opening and breath entering points to bodily resurrection.','Jesus breathed on his disciples and said, “Receive ye the Holy Ghost.”','John 20:22; John 5:28–29'],
furnace:['The three men’s faith includes “but if not”: they will obey even if God doesn’t rescue them. Faith is trust in God, not in a guaranteed outcome.','Many Christians have seen the fourth man in the fire as a pre-incarnate appearance of Christ.','Isaiah 43:2'],
lions:['Daniel 6 is about faithfulness inside a pagan empire: he serves the king well but refuses to stop praying. Empires rise and fall, and God’s kingdom endures.','Like Daniel, Jesus was condemned through a plot and sealed in by a stone, yet came out alive.','Matthew 27:66'],
belshazzar:['Daniel shows God as sovereign over empires: he “removeth kings, and setteth up kings” (2:21). Belshazzar profaned the holy cups, and judgment came that night.','God has appointed a day to judge the world by the man he raised from the dead.','Acts 17:31'],
esther1:['Esther famously never mentions God by name. Many read that silence as the point: God is hidden but working through “coincidences.”','God works all things together for good for those who love him.','Romans 8:28'],
esther:['Esther risks her life to intercede for her people before the throne. Providence doesn’t cancel human courage. It works through it.','Jesus intercedes for his people before the Father’s throne, at the cost of his life.','Hebrews 7:25'],
esther3:['The book’s turning point hinges on a sleepless night, the clearest example of quiet providence in Scripture.','God “neither slumbers nor sleeps” for his people.','Psalm 121:4'],
esther4:['The great reversal theme: the gallows built for Mordecai hangs Haman, and mourning becomes feasting.','On the cross, the instrument of shame became the place of victory.','Colossians 2:14–15'],
nehemiah:['Nehemiah combines prayer and planning: he prays, then asks the king for timber. Faith and hard work aren’t opposites.','Jesus said he would build his church, and the gates of hell would not prevail against it.','Matthew 16:18'],
birth:['God enters history not in a palace but in a feeding trough, announced first to shepherds. Luke stresses humility and fulfilled promise.','The Word became flesh and dwelt among us.','John 1:14'],
cana:['John calls this the first of Jesus’ “signs.” Water jars for purity rituals become overflowing wine, a picture of the new age of joy replacing the old.','Jesus will drink the wine new in his Father’s kingdom.','Matthew 26:29; Isaiah 25:6'],
nicodemus:['“Born again” (or “from above”) means new life from God that no religious effort can produce. A teacher of Israel has to start over like a baby.','Nicodemus’ journey from night-time visitor to open disciple shows faith growing.','John 19:39'],
well:['Jesus crosses ethnic, gender and moral boundaries in one conversation. True worship is “in spirit and in truth,” not tied to a mountain.','The first person in John told plainly that Jesus is Messiah is this Samaritan woman.','John 4:25–26'],
storm:['In the Old Testament only God rules the sea (Psalm 107:29). By calming it with a word, Jesus does what God does.','The disciples asked the right question: “What manner of man is this?”','Mark 4:41'],
hem:['Touching an unclean person made you unclean, but here holiness flows the other way: Jesus’ purity overcomes her impurity.','Jesus restores the outcast to community by calling her “Daughter.”','Mark 5:34'],
loaves:['The feeding echoes manna in the wilderness and Elisha’s feeding miracle (2 Kings 4:42–44). Jesus is the new provider for God’s people.','Jesus followed it with “I am the bread of life.”','John 6:35'],
samaritan:['Jesus turns the lawyer’s question, “Who is my neighbour?”, into “Who acted like a neighbour?” and makes the despised outsider the hero.','Many church fathers saw Christ himself as the Good Samaritan who rescues wounded humanity.','Luke 10:33–35'],
prodigal:['Tim Keller’s book The Prodigal God argues that the parable is about two lost sons, the rebellious younger and the self-righteous older, and a father who is “prodigal,” recklessly extravagant, in grace.','The parable was told to Pharisees grumbling that Jesus ate with sinners.','Luke 15:1–2'],
zacchaeus:['Salvation comes first (“today”) and changed living follows: he gives beyond what the law required.','Jesus’ mission statement: to seek and to save the lost.','Luke 19:10'],
lazarus:['Jesus weeps even though he knows he will raise Lazarus. Sorrow and hope stand together. This is also the sign that pushes the leaders to plot his death.','“I am the resurrection, and the life.”','John 11:25–26'],
risen:['Paul calls the resurrection “firstfruits”: the first part of a harvest that guarantees the rest. It is the foundation of Christian faith: “if Christ be not raised, your faith is vain.”','Christ’s resurrection is the pledge of ours.','1 Corinthians 15:17–20'],
thomas:['Thomas’ doubt ends in the Gospel’s highest confession. Jesus doesn’t reject the doubter but meets him with evidence and invitation.','John wrote his Gospel “that ye might believe.”','John 20:31'],
peter:['Three denials, three questions, three commissions. Jesus restores Peter not by ignoring his failure but by facing it gently, then gives him work to do: “Feed my sheep.”','Failure is not final for a disciple of Jesus.','1 Peter 5:10'],
pentecost:['Pentecost reverses Babel and fulfils Joel 2: the Spirit poured out on all flesh, sons and daughters, young and old.','Jesus had promised power when the Spirit came.','Acts 1:8'],
ethiopian:['Isaiah 56 had promised that eunuchs and foreigners would have a place in God’s house. Here it happens: one of the first non-Jewish converts in Acts is a black African official.','The gospel moves outward to “the uttermost part of the earth.”','Acts 1:8'],
paul:['Paul’s conversion shows that grace can transform the fiercest opponent. Jesus says Saul was persecuting “me,” because Christ is united with his people.','Paul later called himself the chief of sinners, saved as an example of Christ’s patience.','1 Timothy 1:15–16'],
eutychus:['Even in Acts, ordinary weakness (a sleepy young man) meets resurrection power, and then church just carries on with bread and teaching until dawn.','The church meets around the risen Christ in word and bread.','Acts 2:42'],
shipwreck:['Acts ends with the gospel unstoppable: storms, snakes and chains can’t prevent it reaching Rome.','Jesus had promised Paul he would testify in Rome.','Acts 23:11']};

function quizHTML(x,tag){const done=st.quiz[x.id];return `<section class="card quiz" data-q="${x.id}" style="background:radial-gradient(120% 70% at 50% 25%,#3b2a6b,#0d0b1a 70%)">
<div class="txt"><div class="chips"><span class="chip g">${tag==='rv'?'Review · it’s back!':'Quick quiz · +10'}</span><span class="chip">${x.t}</span></div><h2>${x.q.q}</h2>
${x.q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
<div class="fb">${tag==='rv'?'You missed this before. Let’s lock it in.':done!==undefined?'You’ve seen this one before.':''}</div></div></section>`}
const XQ={};let xn=0;
const bookOf=r=>r.replace(/\s+\d.*$/,'');
function genExpert(){const P=pool().length>8?pool():S,t=pick(['ref','verse','order','person','ref','verse']);let q;
  if(t==='ref'){const x=pick(P),b=bookOf(x.ref),others=shuffle([...new Set(S.map(s=>bookOf(s.ref)))].filter(o=>o!==b)).slice(0,2),o=shuffle([b,...others]);q={q:`In which book of the Bible is “${x.t}” found?`,o,a:o.indexOf(b),sid:x.id}}
  else if(t==='verse'){const x=pick(P),v=x.v.length>110?x.v.slice(0,107)+'…':x.v,o=shuffle([x,...shuffle(S.filter(s=>s.id!==x.id)).slice(0,2)]);q={q:`Which story is this verse from? “${v}”`,o:o.map(s=>s.t),a:o.indexOf(x),sid:x.id}}
  else if(t==='order'){let a,b,k=0;const DS=S.filter(s=>YR[s.id]!=null&&!['job','jabez'].includes(s.id));do{a=pick(DS);b=pick(DS);k++}while(k<50&&Math.abs(YR[a.id]-YR[b.id])<100);const o=[a,b];q={q:'Which happened first?',o:o.map(s=>s.t),a:YR[a.id]<YR[b.id]?0:1,sid:a.id}}
  else{const [k,p]=pick(Object.entries(PP).filter(([k,p])=>p[3].length)),yes=byId(pick(p[3])),no=shuffle(S.filter(s=>!p[3].includes(s.id))).slice(0,2),o=shuffle([yes,...no]);q={q:`Which of these stories involves ${p[0]}?`,o:o.map(s=>s.t),a:o.indexOf(yes),sid:yes.id}}
  const id='x'+(xn++);XQ[id]=q;return `<section class="card quiz" data-x="${id}" style="background:radial-gradient(120% 70% at 50% 25%,#5a1f3c,#0d0b1a 70%)">
<div class="txt"><div class="chips"><span class="chip g">Expert · +20</span><span class="chip">${LV[lvl()][1]} level</span></div><h2>${q.q}</h2>
${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}<div class="fb"></div></div></section>`}
function factHTML(x){const f=pick(x.h);return `<section class="card fact" style="background:radial-gradient(120% 70% at 50% 30%,#4a3510,#0d0b1a 72%)">
<div class="txt"><div class="chips"><span class="chip g">Did you know?</span><span class="chip">${x.ref}</span></div><h2 class="fact-t">${f}</h2>
<button class="btn" data-open="${x.id}" style="margin-top:18px">Show me the story: ${x.t}</button></div></section>`}
function recapHTML(){const m=mon(ago(7)),days=[...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return st.lg[dstr(d)]||{r:0,q:0,x:0}}),r=days.reduce((a,d)=>a+d.r,0),q=days.reduce((a,d)=>a+d.q+d.x,0),mx=Math.max(1,...days.map(d=>d.r));
  return `<section class="card fact" style="background:radial-gradient(120% 70% at 50% 30%,#1f4a3a,#0d0b1a 72%)"><div class="txt"><div class="chips"><span class="chip g">Your week</span></div><h2>${r} stories read, ${q} quiz answers right</h2>
<div class="wbars">${days.map((d,i)=>`<div><i style="height:${d.r/mx*100}%"></i><small>${'MTWTFSS'[i]}</small></div>`).join('')}</div>

// ---------- endless feed ----------
const pool=()=>filter==='hid'?S.filter(x=>x.hid):filter&&filter.startsWith('sr:')?SERIES[filter.slice(3)].map(byId):filter?S.filter(x=>x.cat===filter):S;
let queue=[],shown=0,last=[];
function refill(){const p=pool();if(filter&&filter.startsWith('sr:')){queue=queue.concat(p);return}
  queue=queue.concat(shuffle(p.filter(x=>!st.read[x.id])),shuffle(p.filter(x=>st.read[x.id])))}
const due=()=>Object.entries(st.rv).filter(([id,r])=>r.d<=dayN()&&byId(id)).map(([id])=>id);
let rvShown=new Set();
function quizSlot(){const d=due().filter(id=>!rvShown.has(id));if(d.length){rvShown.add(d[0]);return quizHTML(byId(d[0]),'rv')}
  if(lvl()>=1&&Math.random()<.45)return genExpert();
  const p=pool(),cand=shuffle(p.filter(s=>st.quiz[s.id]===undefined&&last.includes(s.id)));return quizHTML(cand[0]||shuffle(p.filter(s=>st.quiz[s.id]===undefined))[0]||pick(p))}
function storyHTML(){if(!queue.length)refill();let x=queue.shift();
  if(last.slice(-4).includes(x.id)&&queue.length>1&&!(filter||'').startsWith('sr:')){queue.push(x);x=queue.shift()}last.push(x.id);shown++;
  if(x.sr&&x.ep<x.eps){const nx=byId(SERIES[x.sr][x.ep]);if(!(filter||'').startsWith('sr:')&&queue[0]!==nx){queue=queue.filter(q=>q!==nx);queue.unshift(nx)}}return cardHTML(x)}
const SLOTS=['s','c','s','v','s','q','c','s','w','s','vq','c','s','f','s','vq','c','v'];
function append(n){let h='';
  for(let k=0;k<n;k++){if(Math.random()<.08)h+=mysteryHTML();
    if(filter||!BIBLE){h+=storyHTML();if(shown%3===0)h+=quizSlot();if(shown%7===0)h+=factHTML(pick(pool()));continue}
    const t=SLOTS[slot++%SLOTS.length];
    if(t==='s')h+=storyHTML();
    else if(t==='c'){if(!st.season)continue;if(todayCh()>=perDay()&&(aheadN++%2))continue;const g=nextChapters(1)[0];if(g!=null)h+=chapterHTML(g)}
    else if(t==='v')h+=verseHTML();
    else if(t==='vq'){const md=Object.keys(st.mem).filter(m=>st.mem[m].d<=dayN()&&!memShown.has(m));if(md.length){memShown.add(md[0]);h+=vquizHTML(md[0])}else h+=vquizHTML()}
    else if(t==='q')h+=quizSlot();
    else if(t==='w')h+=wordHTML(pick(WS));
    else h+=factHTML(pick(S))}
  sentinel.insertAdjacentHTML('beforebegin',h);observe()}
const sentinel=document.createElement('div');sentinel.style.height='1px';
function dailyId(){if(st.dd.d!==today()){const un=S.filter(x=>!st.read[x.id]),src=un.length?un:S;let h=0;for(const ch of today())h=(h*31+ch.charCodeAt(0))>>>0;st.dd={d:today(),id:src[h%src.length].id};save()}return st.dd.id}
function render(){feed.innerHTML='';feed.appendChild(sentinel);queue=[];shown=0;last=[];shownCh=new Set();memShown=new Set();slot=0;
  let h='';if(!filter){if(st.recap!==wk()){const m=mon(ago(7));let r=0;for(let i=0;i<7;i++){const d=new Date(m);d.setDate(d.getDate()+i);r+=(st.lg[dstr(d)]||{r:0}).r}st.recap=wk();save();if(r)h+=recapHTML()}
    const d=byId(dailyId());h+=cardHTML(d,'daily');last.push(d.id);if(!st.season)h+=seasonSetupHTML()}
  sentinel.insertAdjacentHTML('beforebegin',h);append(7);feed.scrollTop=0;
  const f=$('#filter');f.classList.toggle('on',!!filter);f.textContent=filter?(filter==='hid'?'Rarely told':filter.startsWith('sr:')?SNAME[filter.slice(3)]:CATS[filter].n)+'  ✕':''}
new IntersectionObserver(es=>{if(es[0].isIntersecting)append(6)},{root:feed,rootMargin:'0px 0px 300% 0px'}).observe(sentinel);
const io=new IntersectionObserver(es=>es.forEach(e=>{const id=e.target.dataset.id;if(!id)return;
  if(e.isIntersecting){e.target._t=setTimeout(()=>markRead(id),2500)}else clearTimeout(e.target._t)}),{root:feed,threshold:.7});
function observe(){feed.querySelectorAll('.card[data-id]:not([data-o])').forEach(c=>{c.dataset.o=1;io.observe(c)})}
function markRead(id){if(st.read[id])return;st.read[id]=1;lg('r');bump(5);fx.float('+5',innerWidth-44,innerHeight*.5);if(st.col[id]==null){const R=rollRarity(id);st.col[id]=RAR.indexOf(R);if(R[3])addPts(R[3]);showDrop(id,R)}save();questCheck()}
function addPts(n){const L=lvl();st.pts+=n;if(lvl()>L){toast(`Level up: ${LV[lvl()][1]}!${lvl()===1?' Expert quizzes unlocked.':''}`);fx.burst(100);fx.vib([40,40,80])}}

// horizontal "go deeper" panes
feed.addEventListener('scroll',e=>{const h=e.target;if(!h.classList||!h.classList.contains('hs'))return;const i=Math.round(h.scrollLeft/h.clientWidth);
  h.parentNode.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j===i));
  if(i>0&&!h._d){h._d=1;st.deep++;lg('d');questCheck();if(!st.hint){st.hint=1;document.querySelectorAll('.hint').forEach(n=>n.remove())}save()}},true);
const toPane=(card,i)=>{const h=card.querySelector('.hs');h.scrollTo({left:h.clientWidth*i,behavior:'smooth'})};

// ---------- sheets ----------
function openSheet(h){$('#sheet').innerHTML='<div class="grab"></div>'+h;$('#sheet').scrollTop=0;$('#sheet').classList.add('on');$('#scrim').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on')}
const storyRows=ids=>ids.map(byId).filter(Boolean).map(x=>`<button class="row" data-go="${x.id}"><span class="dot" style="background:linear-gradient(160deg,${CATS[x.cat].c[0]},${CATS[x.cat].c[1]})"></span><span><b>${x.t}</b><small>${x.ref}${st.read[x.id]?' · read':''}</small></span></button>`).join('');
function person(k){const p=PP[k];openSheet(`<span class="chip g">Person</span><h3 style="margin-top:10px">${p[0]}</h3><p class="sub">${p[1]}</p>
  ${p[2].length?`<h4>Connected to</h4><div class="wrap">${p[2].filter(r=>PP[r]).map(r=>`<button class="pchip" data-person="${r}">${PP[r][0]}</button>`).join('')}</div>`:''}
  <h4>Stories</h4>${storyRows(p[3])}<button class="btn ghost" data-close>Close</button>`)}
function place(k){const p=PLACES[k],ids=Object.keys(PL).filter(id=>PL[id].includes(k));openSheet(`<span class="chip g">Place</span><h3 style="margin-top:10px">${p[0]}</h3><p class="sub">${ids.length} ${ids.length===1?'story':'stories'} happened here</p>${storyRows(ids)}<button class="btn ghost" data-close>Close</button>`)}
function openNote(id){const x=byId(id),n=st.notes[id];openSheet(`<span class="chip g">My note</span><h3 style="margin-top:10px">${x.t}</h3><p class="verse" style="margin:8px 0">“${x.v}”</p><p class="vref">${x.vr}</p>
  <label class="chk"><input type="checkbox" id="hlc" ${st.hl[id]?'checked':''}> Highlight this verse</label>
  <textarea id="nt" rows="6" placeholder="What is God showing you in this story?">${n?esc(n.t):''}</textarea>
  <button class="btn" data-savenote="${id}">Save note</button>${n?`<button class="btn ghost" data-delnote="${id}">Delete note</button>`:''}<button class="btn ghost" data-close>Close</button>`)}
function refreshCard(id){feed.querySelectorAll(`.card[data-id="${id}"]`).forEach(c=>{const v=c.querySelector('.verse');v&&v.classList.toggle('hl',!!st.hl[id])})}

function goTo(id){closeSheet();show('home');const cards=[...feed.querySelectorAll('.card')],i=Math.round(feed.scrollTop/feed.clientHeight),cur=cards[i]||cards[0];
  cur.insertAdjacentHTML('afterend',cardHTML(byId(id)));observe();cur.nextElementSibling.scrollIntoView({behavior:'smooth'})}
function goReview(){const d=due();if(!d.length){toast('No reviews due. Nice!');return}show('home');const cards=[...feed.querySelectorAll('.card')],i=Math.round(feed.scrollTop/feed.clientHeight),cur=cards[i]||cards[0];
  cur.insertAdjacentHTML('afterend',d.map(id=>quizHTML(byId(id),'rv')).join(''));cur.nextElementSibling.scrollIntoView({behavior:'smooth'})}

function like(card,force){const id=card.dataset.id;st.liked[id]=force?1:!st.liked[id];if(!st.liked[id])delete st.liked[id];card.querySelector('.like').classList.toggle('on',!!st.liked[id]);save()}
function answer(card,b){if(card.dataset.done)return;card.dataset.done=1;const i=+b.dataset.i,cm=1+Math.min(2,Math.floor(st.qrun/3));let ok,a,gain=0;
  if(card.dataset.x){const q=XQ[card.dataset.x];a=q.a;ok=i===a;if(ok){gain=(q.pts||20)*cm;addPts(gain);if(!q.pts)st.xq++;lg('x')}if(q.mem&&st.mem[q.mem]){const m=st.mem[q.mem];if(ok){m.b++;m.d=dayN()+[1,2,4,7,14,30,60][Math.min(m.b,6)]}else{m.b=0;m.d=dayN()+1}}}
  else{const id=card.dataset.q,x=byId(id);a=x.q.a;ok=i===a;const first=st.quiz[id]===undefined;if(first){st.quiz[id]=i;if(ok){gain=10*cm;addPts(gain);lg('q')}}
    const r=st.rv[id];if(!ok)st.rv[id]={b:0,d:dayN()+1};else if(r){r.b++;if(r.b>=4)delete st.rv[id];else r.d=dayN()+[1,3,7,21][r.b]}}
  if(ok){st.qrun++;st.qbest=Math.max(st.qbest,st.qrun)}else st.qrun=0;save();
  card.querySelectorAll('.opt').forEach((o,j)=>{if(j===a)o.classList.add('ok');else if(j===i)o.classList.add('no')});
  card.querySelector('.fb').textContent=ok?(cm>1?`Correct! Combo x${cm}${st.qrun>2?` · ${st.qrun} in a row`:''}`:st.qrun>2?`Correct! ${st.qrun} in a row · combo x2 at 3`:'Correct!'):'Not quite. This one will come back for review.';
  const r=b.getBoundingClientRect();if(ok){fx.float(gain?`+${gain}${cm>1?' x'+cm:''}`:'✓',r.left+r.width/2,r.top);fx.burst(cm>1?80:35,r.left+r.width/2,r.top+r.height/2);fx.vib(15)}else fx.vib([30,40,30]);
  top();questCheck()}

let lastTap=0,lp;
feed.addEventListener('pointerdown',e=>{const v=e.target.closest('.verse');if(!v)return;const id=v.closest('.card').dataset.id;lp=setTimeout(()=>{lp=null;openNote(id)},550)});
['pointerup','pointercancel','pointermove'].forEach(ev=>feed.addEventListener(ev,e=>{if(lp&&(ev!=='pointermove'||Math.abs(e.movementY)+Math.abs(e.movementX)>4)){clearTimeout(lp);lp=null}}));
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.person){person(b.dataset.person);return}
  if(b.dataset.place){place(b.dataset.place);return}
  if(b.dataset.open){goTo(b.dataset.open);return}
  if(b.dataset.go){goTo(b.dataset.go);return}
  if(b.hasAttribute('data-close')){closeSheet();return}
  if(b.dataset.savenote){const id=b.dataset.savenote,t=$('#nt').value.trim();if(t)st.notes[id]={t,d:today()};else delete st.notes[id];if($('#hlc').checked)st.hl[id]=1;else delete st.hl[id];save();refreshCard(id);closeSheet();toast('Note saved');if($('#v-me').classList.contains('on'))saved();return}
  if(b.dataset.delnote){delete st.notes[b.dataset.delnote];save();closeSheet();toast('Note deleted');if($('#v-me').classList.contains('on'))saved();return}});
feed.addEventListener('click',e=>{
  const b=e.target.closest('button'),card=e.target.closest('.card');
  if(b&&b.classList.contains('more')){const p=b.previousElementSibling;p.classList.toggle('open');b.textContent=p.classList.contains('open')?'less':'more';return}
  if(b&&b.classList.contains('opt')){answer(card,b);return}
  if(b&&b.dataset.act&&card&&card.dataset.id){const a=b.dataset.act,id=card.dataset.id,x=byId(id);
    if(a==='like')like(card);
    if(a==='save'){st.saved[id]=!st.saved[id];if(!st.saved[id])delete st.saved[id];b.classList.toggle('on',!!st.saved[id]);toast(st.saved[id]?'Saved':'Removed from saved');save()}
    if(a==='deep')toPane(card,1);
    if(a==='preach')toPane(card,+b.dataset.pane);
    if(a==='note')openNote(id);
    if(a==='copy'){const t=`“${x.v}” (${x.vr}, ${x.vt})`;try{navigator.clipboard.writeText(t).then(()=>toast('Verse copied'),()=>toast('Couldn’t copy'))}catch(err){toast('Couldn’t copy')}}
    return}
  if(card&&card.dataset.id&&!b&&e.target.closest('.pane:first-child')){const now=Date.now();if(now-lastTap<320){like(card,true);const h=document.createElementNS('http://www.w3.org/2000/svg','svg');h.setAttribute('viewBox','0 0 24 24');h.setAttribute('class','pop');h.innerHTML=IC.heart;card.querySelector('.pane').appendChild(h);setTimeout(()=>h.remove(),850)}lastTap=now}
});
let knT;document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.kn)return;const id=t.dataset.kn;clearTimeout(knT);knT=setTimeout(()=>{const v=t.value.trim();if(v)st.know[id]={t:v,d:today()};else delete st.know[id];save();const s=t.parentNode.querySelector('.kns');if(s)s.textContent=v?'Saved '+today():'Saves automatically on this phone';feed.querySelectorAll(`.card[data-id="${id}"] .kn`).forEach(o=>{if(o!==t)o.value=t.value})},500)});
$('#scrim').addEventListener('click',closeSheet);
$('#filter').addEventListener('click',()=>{filter=null;render()});

// ---------- views ----------
let exTab='eras',savTab='saved',mapZ='w';
function show(v,hv){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const d=v==='home';document.body.classList.toggle('disc',d);$('#top').style.display=$('#goal').style.display=$('#filter').style.display=d?'':'none';applyTheme();
  if(v==='today')todayView();if(v==='bible')renderBible(hv);if(v==='plans')explore();if(v==='me'){me();saved()}}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)});
const seg=(tabs,cur,key)=>`<div class="seg">${tabs.map(([k,n])=>`<button class="${k===cur?'on':''}" data-${key}="${k}">${n}</button>`).join('')}</div>`;
function tile(k,n,c,all){const r=all.filter(s=>st.read[s.id]).length;return `<button class="tile" data-c="${k}" style="background:linear-gradient(160deg,${c[0]},${c[1]})"><b>${n}</b><small>${r} of ${all.length} read<div class="bar"><i style="width:${r/all.length*100}%"></i></div></small></button>`}
function explore(){let h=`<h1>Plans</h1><p class="sub">Your Bible season, story collections and study tools.</p>`+seasonCard()+seg([['eras','Collections'],['time','Timeline'],['map','Map'],['people','People'],['words','Words']],exTab,'ex');
  if(exTab==='eras')h+=`<p class="sub">Pick an era, binge a series, or dig into the stories most people never read.</p><h3 class="sh">Series</h3><div class="tiles">${Object.keys(SERIES).map(k=>tile('sr:'+k,SNAME[k],CATS[byId(SERIES[k][0]).cat].c,SERIES[k].map(byId))).join('')}</div>
    <h3 class="sh">Eras</h3><div class="tiles">${tile('hid','Rarely told',['#8a6a1c','#1f1606'],S.filter(s=>s.hid))}${Object.entries(CATS).map(([k,c])=>tile(k,c.n,c.c,S.filter(s=>s.cat===k))).join('')}</div>`;
  if(exTab==='time'){const L=S.filter(s=>YR[s.id]!=null).sort((a,b)=>YR[a.id]-YR[b.id]),r=L.filter(s=>st.read[s.id]).length;
    const G=[[-99999,'Beginnings'],[-2100,'The patriarchs'],[-1500,'Exodus & conquest'],[-1250,'The judges'],[-1050,'The kingdom'],[-930,'Prophets & kings'],[-590,'Exile & return'],[-10,'Jesus'],[30.75,'The early church']];let g=-1;
    h+=`<p class="sub">Every story you read lights up. ${r} of ${L.length} lit.</p><div class="bar tlbar"><i style="width:${r/L.length*100}%"></i></div><div class="tl">`;
    L.forEach(x=>{const y=YR[x.id];let gi=0;G.forEach((q,i)=>{if(y>=q[0])gi=i});if(gi!==g){g=gi;h+=`<h4>${G[gi][1]}</h4>`}
      h+=`<button class="tli ${st.read[x.id]?'lit':''}" data-go="${x.id}"><i></i><span><b>${x.t}</b><small>${fmtY(y)} · ${x.ref}</small></span></button>`});h+='</div>'}
  if(exTab==='map')h+=`<p class="sub">Tap a place to see what happened there. Gold places have stories you’ve read.</p>${seg([['w','Ancient Near East'],['z','Land of Israel']],mapZ,'mz')}<div class="map">${mapSVG(mapZ)}</div><p class="note">Locations are approximate, and some (like the sea crossing and Mt Sinai) are debated.</p>`;
  if(exTab==='people')h+=`<p class="sub">Tap anyone to see their connections and stories.</p><h3 class="sh">The family line of Jesus</h3><p class="note" style="margin-top:0">Besides Mary, Matthew 1 includes four women: Tamar, Rahab, Ruth and Bathsheba (“her that had been the wife of Urias”).</p><div class="line">${LINE.map(([k,n])=>`<button class="ln" data-person="${k}"><i></i>${n}</button>`).join('')}</div>
    <h3 class="sh">Everyone</h3><div class="wrap">${Object.entries(PP).map(([k,p])=>{const r=p[3].filter(i=>st.read[i]).length;return `<button class="pchip ${r?'cur':''}" data-person="${k}">${p[0]}</button>`}).join('')}</div>`;
  if(exTab==='bible'){if(!BIBLE)h+='<p class="sub">Loading the Bible…</p>';else if(exBook==null){h+=`<p class="sub">${crCount()} of 1,189 chapters read. Tap a book to open its chapters.</p><div class="bar tlbar"><i style="width:${crCount()/1189*100}%"></i></div>`+[['Old Testament',0,39],['New Testament',39,66]].map(([n,a,z])=>`<h3 class="sh">${n}</h3><div class="books">${BIBLE.slice(a,z).map((bk,j)=>{const bi=a+j,t=bk[1].length,r=bk[1].filter((_,ci)=>st.cr[bi+'.'+ci]).length;return `<button class="bk ${r===t?'done':''}" data-book="${bi}"><b>${bk[0]}</b><small>${r}/${t}</small><i style="width:${r/t*100}%"></i></button>`}).join('')}</div>`).join('')}
    else{const bk=BIBLE[exBook];h+=`<button class="pchip" data-bkback="1">‹ All books</button><h3 class="sh">${bk[0]}</h3><p class="sub">Gold chapters are read. Tap any chapter to open it.</p><div class="chs">${bk[1].map((_,ci)=>`<button class="${st.cr[exBook+'.'+ci]?'lit':''}" data-read="${exBook}.${ci}">${ci+1}</button>`).join('')}</div>`}}
  if(exTab==='words')h+=`<p class="sub">${WS.length} Hebrew, Greek and Aramaic words that unlock the Bible.</p>`+WS.map((w,i)=>`<button class="row" data-word="${i}"><span><b>${w[0]}</b><small>${w[1]} · ${w[3]}</small></span></button>`).join('');
  $('#exBody').innerHTML=h}
$('#exBody').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ex){exTab=b.dataset.ex;explore();return}if(b.dataset.mz){mapZ=b.dataset.mz;explore();return}
  if(b.classList.contains('tile')){filter=b.dataset.c;render();show('home')}});
$('#exBody').addEventListener('click',e=>{const g=e.target.closest('[data-pl]');if(g)place(g.dataset.pl);const z=e.target.closest('[data-zoom]');if(z){mapZ='z';explore()}});

const COAST=[[27.5,30.9],[29,31.2],[29.9,31.2],[31,31.6],[32.3,31.3],[33,31.1],[34.2,31.3],[34.5,31.6],[34.9,32.4],[35,32.8],[35.1,33.1],[35.5,33.9],[35.8,34.4],[35.9,35.3],[36,35.9],[36.2,36.6],[35.5,36.6],[34.6,36.8],[33,36.2],[31,36.8],[29,36.6],[27.5,36.8]];
const ZCOAST=[[34.2,31.2],[34.47,31.5],[34.65,31.8],[34.75,32.1],[34.85,32.4],[34.95,32.8],[35.07,33.05],[35.2,33.3],[35.3,33.6]];
function mapSVG(z){const B=z==='w'?[27.5,49,27,38]:[34.1,36.2,30.4,33.6],W=360,kx=W/(B[1]-B[0]),H=Math.round((B[3]-B[2])*kx*1.15),ky=H/(B[3]-B[2]);
  const P=([lo,la])=>[((lo-B[0])*kx).toFixed(1),((B[3]-la)*ky).toFixed(1)],pts=a=>a.map(p=>P(p).join(',')).join(' ');
  let s=`<svg viewBox="0 0 ${W} ${H}" class="msvg"><rect width="${W}" height="${H}" fill="#2a2216"/>`;
  if(z==='w'){s+=`<polygon points="${pts(COAST)}" fill="#163348"/><polygon points="${pts([[32.55,29.95],[32.7,29.2],[33.2,28.3],[33.8,27.8],[34.3,27.9],[33.6,28.3],[33.2,29],[32.6,29.95]])}" fill="#163348"/><polygon points="${pts([[35,29.55],[34.6,28.2],[34.4,27],[34.9,27],[34.95,28],[35,29.5]])}" fill="#163348"/><polygon points="${pts([[47.9,30],[49,30.2],[49,27],[48.6,27],[47.7,29.3]])}" fill="#163348"/>
      <polyline points="${pts([[31.25,27],[31.25,29.85],[31.2,30.2],[30.4,31.4]])}" fill="none" stroke="#2f6d8f" stroke-width="2"/><polyline points="${pts([[31.2,30.2],[31.9,31.5]])}" fill="none" stroke="#2f6d8f" stroke-width="2"/>
      <polyline points="${pts([[38.3,37.9],[38,36.8],[38.6,36],[40.1,35.3],[41,34.4],[42,34.2],[43.3,33.4],[44.4,32.5],[45.3,31.6],[46.1,31],[47.4,31],[48,30.4]])}" fill="none" stroke="#2f6d8f" stroke-width="2"/>
      <polyline points="${pts([[40.2,38],[41.9,37.3],[43.1,36.4],[43.5,35.2],[44.3,33.6],[45.5,32.5],[46.6,31.5],[47.4,31]])}" fill="none" stroke="#2f6d8f" stroke-width="2"/>`;
    const a=P([34.1,33.6]),b=P([36.2,30.4]);s+=`<rect data-zoom="1" x="${a[0]}" y="${a[1]}" width="${b[0]-a[0]}" height="${b[1]-a[1]}" fill="#f2c66d22" stroke="#f2c66d" stroke-dasharray="3 3" style="cursor:pointer"/><text x="${+b[0]+5}" y="${(+a[1]+ +b[1])/2+8}" class="ml">Israel (tap)</text>`}
  else{s+=`<polygon points="${pts([...ZCOAST,[34.1,33.6],[34.1,31.2]])}" fill="#163348"/><polyline points="${pts([[35.6,32.75],[35.57,32.4],[35.55,32],[35.55,31.78]])}" fill="none" stroke="#2f6d8f" stroke-width="2.5"/>`;
    const d=P([35.48,31.5]),g=P([35.58,32.82]);s+=`<ellipse cx="${d[0]}" cy="${d[1]}" rx="${.07*kx}" ry="${.3*ky}" fill="#163348"/><ellipse cx="${g[0]}" cy="${g[1]}" rx="${.06*kx}" ry="${.1*ky}" fill="#163348"/>`}
  Object.entries(PLACES).filter(([k,p])=>p[3]===z).forEach(([k,p])=>{const [x,y]=P([p[1],p[2]]),ids=Object.keys(PL).filter(i=>PL[i].includes(k));if(!ids.length)return;const r=ids.some(i=>st.read[i]);
    s+=`<g data-pl="${k}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="14" fill="transparent"/><circle cx="${x}" cy="${y}" r="${4+Math.min(ids.length,6)}" fill="${r?'#f2c66d':'#b8b0c8'}" stroke="#0d0b1a" stroke-width="1.5"/><text x="${p[4]==='l'?x-9:+x+9}" y="${+y+4}" text-anchor="${p[4]==='l'?'end':'start'}" class="ml">${p[0]}</text></g>`});
  return s+'</svg>'}

function saved(){let h=`<h2 class="sh" style="margin-top:28px">Your library</h2>`+seg([['saved','Saved'],['notes','Notes'],['know','I know'],['mem','Memory'],['hl','Highlights']],savTab,'sv');
  if(savTab==='saved'){const l=S.filter(s=>st.saved[s.id]);h+=l.length?storyRows(l.map(x=>x.id)):'<p class="empty">Tap Save on any story to keep it here.</p>'}
  else if(savTab==='know'){const n=Object.entries(st.know).filter(([id])=>byId(id)).sort((a,b)=>a[1].d<b[1].d?1:-1);
    h+=`<p class="sub">${n.length} ${n.length===1?'story':'stories'} with your own insight.</p>`+(n.length?n.map(([id,v])=>`<button class="row nrow" data-go="${id}"><span><b>${byId(id).t}</b><small>${byId(id).ref} · ${v.d}</small><span class="ntext">${esc(v.t)}</span></span></button>`).join(''):'<p class="empty">On any story, swipe left to the “What I know” screen and write what you know about it.</p>')}
  else if(savTab==='mem'){const m=Object.entries(st.mem);h+=!BIBLE?'<p class="sub">Loading…</p>':m.length?`<p class="sub">${m.length} memory ${m.length===1?'verse':'verses'}. They come back as “finish the verse” cards until you know them.</p>`+m.map(([k,v])=>{const [bi,ci,vi]=k.split('.').map(Number);return `<button class="row nrow" data-read="${bi}.${ci}" data-hl="${vi}"><span><b>${BIBLE[bi][0]} ${ci+1}:${vi+1}</b><small>${v.b>=5?'Mastered':v.b?'Learning · level '+v.b:'New'}</small><span class="ntext">${esc(BIBLE[bi][1][ci][vi])}</span></span></button>`}).join(''):'<p class="empty">Tap “Memorise” on a verse card, or tap any verse while reading.</p>'}
  else{const n=Object.entries(st.notes).filter(([id])=>byId(id)).sort((a,b)=>a[1].d<b[1].d?1:-1);

// ===== Whole-Bible season, reader, verse cards, memory verses, word studies =====
const WS=[
['Hesed','Hebrew','חֶסֶד · chesed','Steadfast, loyal, covenant love','There is no single English word for it: love that keeps its promises, kindness that won’t let go. It appears about 250 times in the Old Testament. Psalm 136 repeats “his hesed endures forever” in all 26 verses, and the book of Ruth is a story about it.',['Psalm 136:1','Ruth 1:8','Lamentations 3:22']],
['Shalom','Hebrew','שָׁלוֹם · shalom','Peace, wholeness, everything as it should be','Shalom is more than the absence of conflict. It means completeness and flourishing: right relationships with God, others and creation. It is still a daily greeting in Hebrew. Isaiah calls the coming king the “Prince of Peace” (Sar Shalom).',['Numbers 6:26','Isaiah 9:6','John 14:27']],
['Ruach','Hebrew','רוּחַ · ruach','Breath, wind, spirit','One word covers all three. In Genesis 1 the ruach of God hovers over the waters, and in Ezekiel 37 ruach blows into the dry bones. Jesus plays on the Greek equivalent (pneuma) when he says the wind blows where it wills.',['Genesis 1:2','Ezekiel 37:9','John 3:8']],
['Nephesh','Hebrew','נֶפֶשׁ · nephesh','Life, living being, the whole self','Often translated “soul,” but it isn’t a ghost inside a body. Nephesh is the whole living person. In Genesis 2:7 the man becomes a living nephesh. “Love the LORD your God with all your nephesh” means with your whole life.',['Genesis 2:7','Deuteronomy 6:5','Psalm 103:1']],
['YHWH','Hebrew','יהוה · Yahweh','God’s personal name','The name God revealed to Moses, linked to “I AM.” It appears around 6,800 times. Out of reverence, Jewish readers say “Adonai” (Lord) instead, which is why many English Bibles print LORD in capitals. The World English Bible writes it as “Yahweh.”',['Exodus 3:14','Exodus 34:6','Psalm 23:1']],
['Elohim','Hebrew','אֱלֹהִים · Elohim','God, the mighty one','Elohim is grammatically plural but used with singular verbs when it refers to the God of Israel, the first word for God in the Bible. Many Christians have seen in it a hint of the fullness later revealed as the Trinity, though the grammar is often explained as a “plural of majesty.”',['Genesis 1:1','Deuteronomy 6:4','Psalm 46:10']],
['Go’el','Hebrew','גֹּאֵל · go’el','Kinsman-redeemer','The closest relative who had the right and duty to buy back family land, free a relative from slavery, or carry on a dead man’s name. Boaz is Ruth’s go’el. Job cries, “I know that my go’el lives.”',['Ruth 3:9','Job 19:25','Isaiah 54:5']],
['Berit','Hebrew','בְּרִית · berit','Covenant','A binding relationship sealed by oath, often with a sacrifice. Abraham’s covenant ceremony involved walking between cut animals (Genesis 15), which is why the Hebrew idiom is to “cut” a covenant. The story of the Bible moves through covenants: Noah, Abraham, Moses, David, and the new covenant.',['Genesis 15:18','Jeremiah 31:31','Luke 22:20']],
['Torah','Hebrew','תּוֹרָה · torah','Instruction, teaching, law','Usually translated “law,” but the root idea is teaching or direction, like a parent guiding a child. It also names the first five books of the Bible. Psalm 1 calls the person who delights in torah blessed.',['Psalm 1:2','Psalm 19:7','Joshua 1:8']],
['Kavod','Hebrew','כָּבוֹד · kavod','Glory, weight, honour','The root means “heavy.” God’s glory is his weightiness, his overwhelming reality. Moses asks, “Please show me your glory.” Paul echoes it when he speaks of an “eternal weight of glory.”',['Exodus 33:18','Isaiah 6:3','2 Corinthians 4:17']],
['Qadosh','Hebrew','קָדוֹשׁ · qadosh','Holy, set apart','Holy means set apart, utterly other, pure. The seraphim cry it three times in Isaiah 6, the only attribute of God repeated three times in this way. God then calls his people to be holy as he is holy.',['Isaiah 6:3','Leviticus 19:2','1 Peter 1:16']],
['Emunah','Hebrew','אֱמוּנָה · emunah','Faithfulness, steadiness, faith','From the same root as “amen.” When Moses’ hands stayed raised in battle, they were “steady,” emunah. “The righteous shall live by his faith(fulness)” in Habakkuk 2:4 became a key verse for Paul.',['Exodus 17:12','Habakkuk 2:4','Lamentations 3:23']],
['Amen','Hebrew','אָמֵן · amen','Truly, firmly, so be it','From a root meaning firm or reliable. Ending a prayer with amen means “this is solid; I stand on it.” Jesus uniquely began statements with it: “Amen, I say to you,” often translated “Most certainly” or “Truly.”',['Deuteronomy 27:15','John 3:3','Revelation 3:14']],
['Hallelujah','Hebrew','הַלְלוּ־יָהּ · hallelu-yah','Praise Yah! (Praise the LORD)','A command to a group, “all of you, praise,” plus “Yah,” a short form of God’s name. The last five psalms (146 to 150) each begin and end with it, and it rings out in heaven in Revelation 19.',['Psalm 150:1','Psalm 146:1','Revelation 19:1']],
['Selah','Hebrew','סֶלָה · selah','A musical or reflective pause (meaning uncertain)','Appears 71 times in the Psalms and three times in Habakkuk. No one is sure what it means. Most think it marked a musical interlude or a pause, so many readers treat it as “stop and think about that.”',['Psalm 46:3','Psalm 3:4','Habakkuk 3:3']],
['Shema','Hebrew','שְׁמַע · shema','Hear, and so obey','In Hebrew, to truly hear is to respond. Deuteronomy 6:4, “Hear, Israel,” is called the Shema and is still prayed daily by Jews. Jesus quoted it as the greatest commandment.',['Deuteronomy 6:4','Mark 12:29','James 1:22']],
['Immanuel','Hebrew','עִמָּנוּאֵל · immanu-el','God with us','A name given in Isaiah’s sign to King Ahaz. Matthew applies it to Jesus’ birth, and the Gospel ends with Jesus’ promise, “I am with you always,” bookending the whole Gospel with “God with us.”',['Isaiah 7:14','Matthew 1:23','Matthew 28:20']],
['Messiah / Christos','Hebrew & Greek','מָשִׁיחַ · Χριστός','Anointed one','Kings and priests were anointed with oil. Mashiach in Hebrew became Christos in Greek, so “Christ” isn’t Jesus’ surname but a title: Jesus the Anointed King.',['1 Samuel 16:13','Psalm 2:2','John 1:41']],
['Agape','Greek','ἀγάπη · agapē','Self-giving love','The early Christians took a fairly rare Greek word and filled it with the meaning of the cross: love that gives itself for the good of another, even an enemy. 1 Corinthians 13 describes it; 1 John says God is agape.',['1 Corinthians 13:4','John 15:13','1 John 4:8']],
['Logos','Greek','λόγος · logos','Word, reason, message','Greek philosophers used logos for the rational principle ordering the universe, while Jewish readers thought of God’s creative word in Genesis 1. John declares that the Logos was God and “became flesh.”',['John 1:1','John 1:14','Hebrews 4:12']],
['Charis','Greek','χάρις · charis','Grace, undeserved favour, gift','A free, generous gift that cannot be earned. Paul opens nearly every letter with “grace to you.” It’s the root of words like charisma (gift) and eucharist (thanksgiving).',['Ephesians 2:8','2 Corinthians 12:9','John 1:16']],
['Metanoia','Greek','μετάνοια · metanoia','Repentance, a change of mind','Literally “change of mind,” but in the Bible it means a whole-life turnaround, echoing the Hebrew idea of turning (shuv) back to God. Jesus’ first preaching was “Repent and believe the good news.”',['Mark 1:15','Acts 3:19','Luke 15:7']],
['Ekklesia','Greek','ἐκκλησία · ekklēsia','Assembly, gathering, church','In Greek cities, the ekklesia was the citizens’ assembly called together for public business. The Greek Old Testament used it for Israel gathered before God. The church is not a building but a people called together.',['Matthew 16:18','Acts 2:47','Ephesians 1:22']],
['Euangelion','Greek','εὐαγγέλιον · euangelion','Good news, gospel','In the Roman world this word announced royal good news, such as an emperor’s victory or birthday; an inscription from Priene calls Augustus’ birth “good news.” Mark opens: “The beginning of the good news of Jesus Christ, the Son of God.”',['Mark 1:1','Romans 1:16','Isaiah 52:7']],
['Koinonia','Greek','κοινωνία · koinōnia','Fellowship, sharing, partnership','More than socialising: a shared life, holding things in common, partnering in the gospel and even in Christ’s sufferings. The first church devoted itself to it.',['Acts 2:42','Philippians 1:5','1 John 1:3']],
['Parakletos','Greek','παράκλητος · paraklētos','Helper, advocate, comforter','Literally “one called alongside,” like a legal advocate who stands beside you. Jesus uses it for the Holy Spirit, and 1 John uses it for Jesus himself, our advocate with the Father.',['John 14:16','John 16:7','1 John 2:1']],
['Pistis','Greek','πίστις · pistis','Faith, trust, faithfulness','Pistis is not wishful thinking but trust that leans its weight on someone reliable. The same word can mean faithfulness. Hebrews 11 is its great showcase.',['Hebrews 11:1','Romans 5:1','Galatians 2:20']],
['Sozo','Greek','σῴζω · sōzō','Save, heal, rescue, make whole','The same word covers rescue from danger, physical healing and eternal salvation. When Jesus tells the bleeding woman “your faith has made you well,” the verb is sozo: she was healed and saved.',['Mark 5:34','Luke 19:10','Romans 10:9']],
['Abba','Aramaic','אַבָּא · abba','Father','The Aramaic word for father, used by Jesus in Gethsemane. Paul says the Spirit enables believers to cry “Abba, Father.” It is warm and intimate, though scholars caution it isn’t simply baby-talk like “daddy”; adults used it too.',['Mark 14:36','Romans 8:15','Galatians 4:6']],
['Maranatha','Aramaic','מָרַנָא תָא · marana tha','Our Lord, come!','One of the earliest Christian prayers, kept in Aramaic even in Paul’s Greek letter to the Corinthians. The Bible’s final prayer says the same in Greek: “Come, Lord Jesus.”',['1 Corinthians 16:22','Revelation 22:20','Philippians 4:5']]];
