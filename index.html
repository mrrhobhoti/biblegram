<style>
/* VOICE: calm, clean Bible-app shell with an immersive night-time Discover feed
   IDEA: an illuminated scroll you swipe, one story per screen
   PICTURE: each card is a full-bleed scene in its era's colours with a large glowing glyph
   COLOUR and TYPE: deep night grounds, lamp gold accent; Fraunces titles, Inter body

:root{color-scheme:light;--bg:#ffffff;--ink:#16151a;--dim:#6a6874;--gold:#a8580a;--panel:#f4f3f7;--line:#0000001a;--tint:#0000000d;--btn:#16151a;--btnink:#ffffff;--sheet:#ffffff;

.dark{color:var(--ink);background:var(--bg)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.view{position:fixed;inset:0 0 var(--nav) 0;display:none}
.view.on{display:block}
#feed{overflow-y:scroll;scroll-snap-type:y mandatory;height:100%;scrollbar-width:none}

.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.card.quiz,.card.fact,.card.chap{display:flex;flex-direction:column;justify-content:center;padding:calc(var(--top) + 70px) 18px 22px}
.hs{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}

.pane.deep{display:block;overflow-y:auto;padding:calc(var(--top) + 76px) 20px 48px}
.dp{max-width:640px;margin:0 auto}.dp h3{font-size:28px;margin:12px 0 4px}.dp h4,.sheet h4{font-family:Fraunces,Georgia,serif;font-size:19px;margin:18px 0 8px;color:var(--gold)}

.daily{display:inline-block;margin-bottom:10px;padding:6px 12px;border-radius:10px;background:var(--gold);color:#241a05;font-weight:600;font-size:13px}

.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;margin-top:10px}.chs button{height:48px;border-radius:10px;background:var(--panel);font-weight:600}.chs button.lit{background:var(--gold);color:var(--btnink)}
.seg{flex-wrap:nowrap}.seg button{flex:1 0 auto;padding:10px 10px;font-size:13.5px}
.bhead{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;padding:calc(var(--top) + 10px) 60px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
#bpick{font-weight:700;font-size:16px;padding:9px 16px;border-radius:99px;background:var(--tint);min-height:42px}#bpick span{color:var(--dim);font-size:11px;margin-left:6px}

#v-bible.on{display:flex;flex-direction:column}.bbody{flex:1;overflow-y:auto;padding:4px 22px 110px}
.rwrap{max-width:680px;margin:0 auto}.rbook{text-align:center;color:var(--dim);margin:22px 0 0;font-weight:600;letter-spacing:.02em}.rch{text-align:center;font-size:64px;margin:0 0 12px}

.bnav{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}.bnav button{pointer-events:auto;width:50px;height:50px;border-radius:50%;background:var(--bg);color:var(--ink);box-shadow:0 2px 12px #0000002e;font-size:26px;line-height:1;border:1px solid var(--line)}.bnav button:disabled{opacity:.3}
.bl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.bl button{text-align:left;padding:10px 12px;border-radius:12px;background:var(--panel);min-height:48px}.bl span{display:block;font-weight:600}.bl small{color:var(--dim);font-size:12px}
.vsheet{font:20px/1.5 Fraunces,Georgia,serif;margin:14px 0 4px}
.swr{display:flex;gap:12px;align-items:center}.swb{width:44px;height:44px;border-radius:50%;border:2px solid var(--line)}.swb.on{border-color:var(--ink)}.swb.x{background:var(--tint);color:var(--dim)}
.fsrow{display:flex;align-items:center;gap:14px}.fsrow button{width:56px;height:48px;border-radius:12px;background:var(--tint);font-weight:700;font-size:18px}

.dot.wd{display:grid;place-items:center;background:var(--gold);color:var(--btnink);font:700 20px Fraunces,Georgia,serif}

.wrap{display:flex;flex-wrap:wrap;gap:8px}.pchip{padding:9px 14px;border-radius:99px;background:var(--tint);border:1px solid var(--line);font-size:15px;min-height:40px;text-align:left}.pchip.cur{border-color:var(--gold);color:var(--gold)}

.tli::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--tint)}.tli.lit i{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px #f2c66d99}.tli b{display:block}.tli small{color:var(--dim)}.tli:not(.lit) b{color:var(--dim)}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--sheet);color:var(--ink);box-shadow:0 -6px 30px #0003;border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto;transform:translateY(105%);transition:transform .3s ease}
.sheet.on{transform:none}.scrim.on{display:block}

.sheet li{padding:12px 0 12px 22px;border-top:1px solid var(--line);position:relative}
.sheet li::before{content:"";position:absolute;left:2px;top:21px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.btn{display:block;width:100%;padding:14px;border-radius:99px;background:var(--btn);color:var(--btnink);font-weight:600;text-align:center;min-height:48px;margin-top:8px}
.btn.ghost{background:var(--tint);color:var(--ink)}
.toast{position:fixed;left:50%;top:calc(var(--top) + 80px);transform:translate(-50%,-20px);opacity:0;background:var(--btn);color:var(--btnink);font-weight:600;padding:10px 18px;border-radius:99px;z-index:10;transition:.3s;max-width:90vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

.fxp{position:fixed;z-index:21;pointer-events:none;font:700 24px Fraunces,Georgia,serif;color:#f2c66d;text-shadow:0 2px 10px #000b;animation:fxup 1s ease-out forwards;white-space:nowrap}
@keyframes fxup{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}
.opt.no{animation:shake .35s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.drop{position:fixed;left:50%;bottom:calc(var(--nav) + 14px);transform:translate(-50%,30px);opacity:0;z-index:10;min-width:230px;max-width:88vw;padding:10px 18px;border-radius:16px;background:#1a1630f2;border:1px solid #b8b0c8;color:#f6f1e7;text-align:center;pointer-events:none;transition:.3s}
.drop.on{opacity:1;transform:translate(-50%,0)}.drop small{display:block;font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#b8b0c8}.drop b{font:700 17px Fraunces,Georgia,serif}
.drop.rare{border-color:#5aa9ff;box-shadow:0 0 20px #5aa9ff66}.drop.rare small{color:#5aa9ff}
.drop.epic{border-color:#c77dff;box-shadow:0 0 26px #c77dff88}.drop.epic small{color:#c77dff}
.drop.legendary{border-color:#ffd24d;box-shadow:0 0 34px #ffd24daa;animation:glow 1s ease-in-out infinite alternate}.drop.legendary small{color:#ffd24d}
@keyframes glow{to{box-shadow:0 0 50px #ffd24dff}}
.streak.risk{background:#ff4d2f88;animation:rk 1.3s ease-in-out infinite}@keyframes rk{50%{transform:scale(1.08)}}
.riskb{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:16px;background:#ff4d2f1f;border:1px solid #ff4d2f88;margin-bottom:16px}.riskb b{font-size:16px}.riskb span{color:var(--dim);font-size:14px}.riskb button{align-self:flex-start;margin-top:6px;padding:8px 16px;border-radius:99px;background:#ff6a3d;color:#fff;font-weight:600}
.qbar{height:4px;background:var(--tint);border-radius:4px;margin-top:6px}.qbar em{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width .4s}
.alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-bottom:6px}.alb button{aspect-ratio:1;border-radius:8px;background:var(--tint);font-size:11px;font-weight:600;color:var(--ink)}

// Verses: World English Bible (public domain)
const S=[
{id:'creation',cat:'beg',t:'In the Beginning',ref:'Genesis 1–2',era:'Before history',v:'In the beginning, God created the heavens and the earth.',vr:'Genesis 1:1',s:'Out of darkness and empty waters, God speaks and the world appears: light, sky, land, sea, stars, plants, animals. On the sixth day he forms humans in his own image and calls everything “very good.” On the seventh day he rests.',h:['“Genesis” comes from a Greek word for origin. The Hebrew title, Bereshit, is simply its first word: “In the beginning.”','Neighbouring peoples had their own creation stories, such as Babylon’s Enuma Elish, where the world is made from the body of a slain goddess. Genesis is strikingly different: one God creates calmly, just by speaking.','The sun and moon are not named in Genesis 1, only called the “greater” and “lesser” lights. Many scholars see this as a quiet challenge to cultures that worshipped them.'],q:{q:'What did God do on the seventh day?',o:['Created humans','Rested','Made the stars'],a:1},series:'Genesis'},
{id:'noah',cat:'beg',t:'Noah and the Flood',ref:'Genesis 6–9',era:'Ancient world',v:'I set my rainbow in the cloud, and it will be a sign of a covenant between me and the earth.',vr:'Genesis 9:13',s:'The world fills with violence, but Noah walks with God. He builds a huge ark, gathers his family and the animals, and rides out the flood. When the waters go down, God puts a rainbow in the sky and promises never to flood the earth like that again.',h:['Flood stories appear across ancient Mesopotamia. The best known is in the Epic of Gilgamesh, whose hero also builds a boat and sends out birds.','By Genesis’ measurements (300 × 50 × 30 cubits) the ark was about 137 m long, roughly the size of a modern cargo ship.','A cubit was the length from elbow to fingertip, about 45 cm.'],q:{q:'What sign did God give after the flood?',o:['A dove','A rainbow','A star'],a:1},series:'Genesis'},
{id:'abraham',cat:'beg',t:'The Call of Abraham',ref:'Genesis 12',era:'c. 2000–1800 BC',v:'I will make of you a great nation. I will bless you and make your name great. You will be a blessing.',vr:'Genesis 12:2',s:'God tells Abram to leave his country and family and go to a land he will be shown. With no map and no children, Abram goes anyway. God promises that through him all the families of the earth will be blessed.',h:['Abraham’s family came from Ur of the Chaldeans, a great Sumerian city in what is now southern Iraq. Leonard Woolley excavated it in the 1920s and found royal tombs and a giant ziggurat.','From Ur he travelled to Harran and then on to Canaan, a journey of well over 1,500 km along the Fertile Crescent.','Abraham is honoured as a father of faith in Judaism, Christianity and Islam.'],q:{q:'Which city did Abraham’s family come from?',o:['Babylon','Ur','Jericho'],a:1},series:'Genesis'},
{id:'isaac',cat:'beg',t:'The Test on the Mountain',ref:'Genesis 22',era:'c. 2000–1800 BC',v:'God will provide himself the lamb for a burnt offering, my son.',vr:'Genesis 22:8',s:'God asks Abraham to offer up Isaac, the son he waited decades for. Abraham climbs the mountain with a broken heart. At the last moment an angel stops him, and a ram caught in a thicket is offered instead.',h:['The story takes place in “the land of Moriah.” 2 Chronicles 3:1 says Solomon later built the Temple on Mount Moriah in Jerusalem.','Child sacrifice was practised by some peoples of the region. This story ends with God stopping it.','Abraham names the place “The LORD Will Provide.”'],q:{q:'What was offered instead of Isaac?',o:['A lamb from home','A ram in a thicket','A dove'],a:1},series:'Genesis'},
{id:'joseph',cat:'beg',t:'Joseph: From Pit to Palace',ref:'Genesis 37–50',era:'c. 1700s BC',v:'As for you, you meant evil against me, but God meant it for good, to bring to pass, as it is today, to save many people alive.',vr:'Genesis 50:20',s:'Joseph’s jealous brothers sell him into slavery. In Egypt he is falsely accused and thrown in prison, but God gives him the gift of explaining dreams. He rises to second-in-command and saves Egypt, and his own family, from a terrible famine.',h:['Egypt’s harvests depended on the yearly Nile flood. A few weak floods in a row could mean famine across the region.','Archaeologists have found that many Semitic people (from Canaan and Syria) settled in Egypt’s Nile Delta, at a city called Avaris, in this period.','Joseph’s famous coat may have been a long robe with sleeves, a sign of status, rather than “many colours.” The Hebrew phrase is uncertain.'],q:{q:'How did Joseph end up in Egypt?',o:['He was sold by his brothers','He fled a famine','He was sent as a prince'],a:0},series:'Genesis'},
{id:'bush',cat:'exo',t:'The Burning Bush',ref:'Exodus 3',era:'c. 1400–1250 BC',v:'I AM WHO I AM.',vr:'Exodus 3:14',s:'Moses, now a shepherd in the desert, sees a bush on fire that doesn’t burn up. God speaks from it: he has seen his people suffering as slaves in Egypt, and he is sending Moses to set them free.',h:['This happens at Mount Horeb, also called Sinai. Since the 500s AD, St Catherine’s Monastery in Egypt’s Sinai desert has kept a bush said to be the one Moses saw.','God’s name, YHWH, seems to be linked to the Hebrew verb “to be,” which matches “I AM WHO I AM.”','The date of the Exodus is debated: some scholars favour the 1400s BC, others the 1200s BC.'],q:{q:'What was unusual about the bush?',o:['It spoke Egyptian','It burned but did not burn up','It grew overnight'],a:1},series:'Exodus'},
{id:'redsea',cat:'exo',t:'Crossing the Sea',ref:'Exodus 14',era:'c. 1400–1250 BC',v:'Yahweh will fight for you, and you shall be still.',vr:'Exodus 14:14',s:'Pharaoh’s army traps the Israelites against the sea. Moses stretches out his hand, a strong east wind blows all night, and the waters part. The people walk through on dry ground, and the sea closes behind them.',h:['The Hebrew name is Yam Suph, often translated “Sea of Reeds.” Its exact location is still debated.','Egyptian chariots were light two-man vehicles, the fastest weapons of the time.','The Exodus is remembered every year at Passover, one of the oldest festivals still kept today.'],q:{q:'What did God use to part the waters?',o:['An earthquake','A strong east wind','Moses’ sword'],a:1},series:'Exodus'},
{id:'jericho',cat:'exo',t:'The Walls of Jericho',ref:'Joshua 6',era:'c. 1400–1200 BC',v:'Be strong and courageous. Don’t be afraid. Don’t be dismayed, for Yahweh your God is with you wherever you go.',vr:'Joshua 1:9',s:'Instead of attacking, Israel marches around Jericho once a day for six days. On the seventh day they march seven times, the priests blow trumpets, the people shout, and the walls fall down.',h:['Jericho is one of the oldest inhabited cities on earth, with settlements about 10,000 years old.','Archaeologists have argued for decades over when Jericho’s walls fell. John Garstang dated them to Joshua’s time, while Kathleen Kenyon dated them earlier.','Jericho sits about 250 m below sea level, among the lowest cities in the world.'],q:{q:'How many times did they march on the seventh day?',o:['Once','Three times','Seven times'],a:2},series:'Conquest'},
{id:'ruth',cat:'kng',t:'Ruth’s Loyal Love',ref:'Ruth 1–4',era:'Time of the Judges',v:'Where you go, I will go; and where you stay, I will stay.',vr:'Ruth 1:16',s:'After her husband dies, Ruth, a foreigner from Moab, refuses to leave her grieving mother-in-law Naomi. She gathers leftover grain in the fields of a kind man named Boaz, who marries her and restores the family.',h:['Moab lay east of the Dead Sea, in what is now Jordan. Moabites and Israelites were often enemies.','Ruth became the great-grandmother of King David, so a foreign widow is in the royal line.','Gleaning was a law that let poor people collect what harvesters missed (Leviticus 19:9–10). It was ancient social welfare.'],q:{q:'Ruth was the great-grandmother of which king?',o:['Saul','David','Solomon'],a:1},series:'Road to the throne'},
{id:'david',cat:'kng',t:'David and Goliath',ref:'1 Samuel 17',era:'c. 1020 BC',v:'You come to me with a sword, with a spear, and with a javelin; but I come to you in the name of Yahweh of Armies.',vr:'1 Samuel 17:45',s:'A giant Philistine champion mocks Israel for forty days. A shepherd boy named David turns down the king’s armour, picks five smooth stones, and brings Goliath down with a single sling shot.',h:['Goliath came from Gath, one of five Philistine cities. Its ruins at Tell es-Safi in Israel have been excavated.','The Tel Dan stone (9th century BC) mentions the “House of David.” It is the earliest known reference to David outside the Bible.','Slingers were deadly soldiers. A sling stone could reach speeds over 100 km/h.'],q:{q:'How many stones did David pick up?',o:['One','Three','Five'],a:2},series:'Road to the throne'},
{id:'solomon',cat:'kng',t:'Solomon Asks for Wisdom',ref:'1 Kings 3',era:'c. 970 BC',v:'Give your servant therefore an understanding heart to judge your people.',vr:'1 Kings 3:9',s:'God tells young King Solomon to ask for anything. He doesn’t ask for riches or long life, just wisdom to lead well. God gives him wisdom, and riches and honour too. Soon he settles a famous dispute between two mothers over one baby.',h:['Solomon built the first Temple in Jerusalem. The Babylonians destroyed it in 586 BC.','He is linked with Proverbs, Ecclesiastes and the Song of Songs.','1 Kings says the Queen of Sheba visited him. Sheba is often placed in southern Arabia (Yemen) or Ethiopia.'],q:{q:'What did Solomon ask God for?',o:['Riches','Long life','Wisdom'],a:2},series:'Road to the throne'},
{id:'elijah',cat:'pro',t:'Elijah and the Still Small Voice',ref:'1 Kings 18–19',era:'c. 860 BC',v:'After the fire, there was a still small voice.',vr:'1 Kings 19:12',s:'On Mount Carmel, Elijah faces 450 prophets of Baal, and fire falls from heaven. Days later, exhausted and afraid, he runs to the desert. God meets him not in wind, earthquake or fire, but in a gentle whisper.',h:['King Ahab, Elijah’s enemy, appears in an Assyrian inscription, the Kurkh Monolith, which says he brought 2,000 chariots to a battle in 853 BC.','Baal was the Canaanite storm god, so a drought and fire from the sky challenged him on his own ground.','Mount Carmel overlooks the modern city of Haifa in Israel.'],q:{q:'How did God speak to Elijah in the desert?',o:['In an earthquake','In a gentle whisper','In a fire'],a:1},series:'Prophets'},
{id:'jonah',cat:'pro',t:'Jonah Runs Away',ref:'Jonah 1–4',era:'8th century BC',v:'I called because of my affliction to Yahweh. He answered me.',vr:'Jonah 2:2',s:'God sends Jonah to Nineveh, the capital of Israel’s brutal enemy. Jonah sails the other way, gets thrown overboard and is swallowed by a great fish. He finally preaches, the city repents, and Jonah sulks because God showed mercy.',h:['Nineveh was a great city of the Assyrian Empire, across the river from modern Mosul in Iraq.','Assyria was feared for its cruelty, which is why Jonah did not want them saved.','Nineveh fell to the Babylonians and Medes in 612 BC.'],q:{q:'Why did Jonah run away?',o:['He was afraid of the sea','He didn’t want Nineveh shown mercy','He was lost'],a:1},series:'Prophets'},
{id:'furnace',cat:'exi',t:'The Fiery Furnace',ref:'Daniel 3',era:'c. 600 BC',v:'Our God whom we serve is able to deliver us from the burning fiery furnace.',vr:'Daniel 3:17',s:'King Nebuchadnezzar orders everyone to bow to a giant golden statue. Three young Jewish exiles refuse and are thrown into a blazing furnace. The king looks in and sees four men walking unharmed in the fire.',h:['Nebuchadnezzar II ruled Babylon from 605 to 562 BC. Many bricks from his building projects are stamped with his name.','The statue was 60 by 6 cubits, about 27 m tall. That is as tall as a nine-storey building.','Babylon’s Ishtar Gate, built by Nebuchadnezzar, has been rebuilt in Berlin’s Pergamon Museum.'],q:{q:'How many men did the king see in the fire?',o:['Three','Four','Seven'],a:1},series:'Daniel'},
{id:'lions',cat:'exi',t:'Daniel in the Lions’ Den',ref:'Daniel 6',era:'c. 539 BC',v:'My God has sent his angel, and has shut the lions’ mouths, and they have not hurt me.',vr:'Daniel 6:22',s:'Jealous officials trick the king into banning prayer to anyone but himself. Daniel keeps praying three times a day at his open window. He spends a night with the lions and walks out without a scratch.',h:['By now Babylon had fallen to the Persians. Daniel served under a king the book calls Darius the Mede.','Ancient Near Eastern kings did keep lions. Assyrian palace carvings of royal lion hunts are now in the British Museum.','Daniel prayed facing Jerusalem, a custom Jews kept in exile (compare 1 Kings 8:48).'],q:{q:'How often did Daniel pray each day?',o:['Once','Three times','Seven times'],a:1},series:'Daniel'},
{id:'esther',cat:'exi',t:'Esther: For Such a Time',ref:'Esther 1–10',era:'c. 480 BC',v:'Who knows if you haven’t come to the kingdom for such a time as this?',vr:'Esther 4:14',s:'A Jewish orphan becomes queen of Persia. When a powerful official plots to wipe out her people, Esther risks death by going to the king uninvited. Her courage turns the plot upside down.',h:['The story takes place at the palace of Susa (Shushan), in what is now south-west Iran. Its ruins can still be visited.','King Ahasuerus is usually identified as Xerxes I (486–465 BC), the king who invaded Greece.','Jews still celebrate Esther’s story every year at the festival of Purim.'],q:{q:'Which festival celebrates Esther’s story?',o:['Passover','Purim','Pentecost'],a:1},series:'Exile & return'},
{id:'nehemiah',cat:'exi',t:'Rebuilding the Walls',ref:'Nehemiah 1–8',era:'c. 445 BC',v:'The joy of Yahweh is your strength.',vr:'Nehemiah 8:10',s:'Nehemiah, the Persian king’s cupbearer, weeps when he hears Jerusalem’s walls lie in ruins. He gets permission to go and rebuild. Facing threats and mockery, the people work with a tool in one hand and a weapon in the other.',h:['A cupbearer tasted the king’s wine to guard against poison, which made him a highly trusted adviser.','Nehemiah 6:15 says the wall was finished in just 52 days.','The king was Artaxerxes I of Persia, who ruled 465–424 BC.'],q:{q:'How long did rebuilding the wall take?',o:['52 days','7 years','40 days'],a:0},series:'Exile & return'},
{id:'birth',cat:'jes',t:'A Baby in Bethlehem',ref:'Luke 2',era:'c. 6–4 BC',v:'For there is born to you today, in David’s city, a Savior, who is Christ the Lord.',vr:'Luke 2:11',s:'Mary and Joseph travel to Bethlehem for a census, and there is no room for them. Jesus is born and laid in a feeding trough. Angels light up the night sky for shepherds, who run to see him.',h:['Bethlehem means “house of bread.” It is about 9 km south of Jerusalem.','Herod the Great died around 4 BC, so most historians date Jesus’ birth to about 6–4 BC. The calendar was miscalculated centuries later.','Shepherds were seen as low-status workers, yet they heard the news first.'],q:{q:'What does “Bethlehem” mean?',o:['City of peace','House of bread','Place of stars'],a:1},series:'Life of Jesus'},
{id:'cana',cat:'jes',t:'Water into Wine',ref:'John 2',era:'c. AD 28',v:'You have kept the good wine until now!',vr:'John 2:10',s:'At a village wedding in Cana the wine runs out, which would be a deep embarrassment for the family. Jesus has servants fill six stone jars with water, and it becomes the best wine of the feast. It is his first sign.',h:['Six stone jars of 2–3 measures each held roughly 450–700 litres of wine.','Stone jars were used for Jewish purity washing because stone was thought unable to become impure. Archaeologists find many stone vessels in Galilee from this era.','Village weddings could last up to a week.'],q:{q:'What were the jars made of?',o:['Clay','Stone','Bronze'],a:1},series:'Life of Jesus'},
{id:'storm',cat:'jes',t:'Calming the Storm',ref:'Mark 4',era:'c. AD 29',v:'Peace! Be still!',vr:'Mark 4:39',s:'A violent storm hits the Sea of Galilee while Jesus sleeps in the boat. The terrified disciples wake him. He speaks to the wind and waves, and everything goes completely calm.',h:['The Sea of Galilee lies about 210 m below sea level. Winds rushing down from the hills can whip up sudden storms.','In 1986, in a drought, a 1st-century fishing boat about 8 m long was found in the mud. It is now called the “Jesus Boat.”','At least four of the disciples were fishermen on this lake.'],q:{q:'Where did this storm happen?',o:['Mediterranean Sea','Sea of Galilee','Dead Sea'],a:1},series:'Life of Jesus'},
{id:'loaves',cat:'jes',t:'Five Loaves, Two Fish',ref:'John 6',era:'c. AD 29',v:'There is a boy here who has five barley loaves and two fish, but what are these among so many?',vr:'John 6:9',s:'A huge crowd follows Jesus into the hills with no food. A boy offers his small lunch. Jesus gives thanks, and five thousand men, plus women and children, eat until they’re full, with twelve baskets left over.',h:['Barley bread was the cheap food of the poor, so this was a humble lunch.','Apart from the resurrection, this is the only miracle recorded in all four Gospels.','The fish were probably dried or salted. Magdala, a town on the lake, was known for fish processing.'],q:{q:'How many baskets were left over?',o:['Five','Seven','Twelve'],a:2},series:'Life of Jesus'},
{id:'samaritan',cat:'jes',t:'The Good Samaritan',ref:'Luke 10',era:'Parable',v:'Go and do likewise.',vr:'Luke 10:37',s:'A man is beaten and left for dead on the road. A priest and a Levite walk past. A Samaritan, from a people the listeners despised, stops, bandages him, and pays for his care. Jesus asks: who was the real neighbour?',h:['The road from Jerusalem down to Jericho drops about 1,000 m in roughly 27 km through lonely desert, and it was known for robbers.','Jews and Samaritans had centuries of hostility over worship and ancestry, which made the hero shocking.','Oil and wine were common first aid. Wine cleaned wounds and oil soothed them.'],q:{q:'Who stopped to help the man?',o:['A priest','A Levite','A Samaritan'],a:2},series:'Parables'},
{id:'prodigal',cat:'jes',t:'The Lost Son',ref:'Luke 15',era:'Parable',v:'This, my son, was dead, and is alive again. He was lost, and is found.',vr:'Luke 15:24',s:'A younger son demands his inheritance early and wastes it all. Starving and feeding pigs, he heads home to beg for a job. His father sees him far off, runs to him, and throws a party.',h:['Asking for the inheritance early was like saying “I wish you were dead.”','The firstborn got a double share (Deuteronomy 21:17), so the younger son likely received a third.','Pigs were unclean under Jewish law, so tending them was a picture of rock bottom. Dignified older men also didn’t run in public, which made the father’s run startling.'],q:{q:'What job did the son end up doing?',o:['Fishing','Feeding pigs','Carpentry'],a:1},series:'Parables'},
{id:'zacchaeus',cat:'jes',t:'Zacchaeus Up a Tree',ref:'Luke 19',era:'c. AD 30',v:'For the Son of Man came to seek and to save that which was lost.',vr:'Luke 19:10',s:'Zacchaeus, a rich and hated chief tax collector, is too short to see Jesus over the crowd, so he climbs a sycamore-fig tree. Jesus stops, calls him by name, and invites himself to dinner. Zacchaeus gives half his wealth to the poor.',h:['Tax collectors worked for Rome and often overcharged, so many saw them as traitors and thieves.','Jericho was a rich trade city on major roads, which made it a good post for a chief tax collector.','He promised to repay four times what he had cheated, more than the law required.'],q:{q:'What kind of tree did Zacchaeus climb?',o:['Olive','Sycamore-fig','Cedar'],a:1},series:'Life of Jesus'},
{id:'lazarus',cat:'jes',t:'Lazarus, Come Out!',ref:'John 11',era:'c. AD 30',v:'Jesus wept.',vr:'John 11:35',s:'Jesus’ friend Lazarus has been dead four days. Jesus weeps with the grieving sisters, then stands at the tomb and calls, “Lazarus, come out!” The dead man walks out, still wrapped in grave clothes.',h:['Bethany was about 3 km from Jerusalem (John 11:18 says 15 stadia).','“Jesus wept” is the shortest verse in most English Bibles.','Some Jewish thinking of the time held that the soul lingered near the body for three days, so day four meant he was truly gone.'],q:{q:'How long had Lazarus been dead?',o:['One day','Three days','Four days'],a:2},series:'Life of Jesus'},
{id:'risen',cat:'jes',t:'He Is Risen',ref:'Matthew 28',era:'c. AD 30–33',v:'He is not here, for he has risen, just like he said.',vr:'Matthew 28:6',s:'At dawn on the third day, women go to Jesus’ tomb with spices. The stone has been rolled away, and an angel tells them he is alive. Then Jesus himself meets them on the road.',h:['Women were the first witnesses. At the time a woman’s testimony carried little weight in court, which historians note is an unlikely detail to make up.','Rolling-stone tombs from this period have been found around Jerusalem.','Pontius Pilate, who ordered the crucifixion, is named on a stone found at Caesarea in 1961.'],q:{q:'Who first found the empty tomb?',o:['Peter and John','The women','Roman soldiers'],a:1},series:'Life of Jesus'},
{id:'pentecost',cat:'chu',t:'Fire at Pentecost',ref:'Acts 2',era:'c. AD 30–33',v:'They were all filled with the Holy Spirit.',vr:'Acts 2:4',s:'Fifty days after Passover, the disciples are praying together. A rushing wind fills the house, and flames rest on each of them. They pour into the streets speaking languages they never learned, and 3,000 people join them that day.',h:['Pentecost (“fiftieth”) was the Jewish Feast of Weeks, a harvest festival that brought pilgrims to Jerusalem from across the world.','Acts 2 lists around 15 nations and regions, from Persia to Rome to Libya.','Many see this as a reversal of the Tower of Babel, where languages divided people.'],q:{q:'How many people joined that day?',o:['120','3,000','5,000'],a:1},series:'Early Church'},
{id:'paul',cat:'chu',t:'Blinded on the Road',ref:'Acts 9',era:'c. AD 34',v:'Saul, Saul, why do you persecute me?',vr:'Acts 9:4',s:'Saul is hunting down Christians when a blinding light knocks him to the ground on the road to Damascus. Jesus speaks to him. Three days later his sight returns, and the persecutor becomes Paul, the greatest missionary of the early church.',h:['In Damascus, Saul stayed on “the street called Straight.” A long straight street, the ancient Via Recta, still runs through the old city.','Thirteen New Testament letters carry Paul’s name.','Paul travelled an estimated 16,000 km on his missionary journeys, by road and by sea.'],q:{q:'What city was Saul travelling to?',o:['Rome','Damascus','Antioch'],a:1},series:'Early Church'}];

S.find(x=>x.id==='joseph').p=[{w:'Voddie Baucham',t:'Baucham warned against reading Joseph as just a lesson in being a good person. Read within Genesis’ big themes of land, seed and covenant, the story builds toward the rise of Judah, the tribe Jesus comes from, and points to Christ, the rejected brother who becomes the saviour of the ones who rejected him.',s:'Joseph and the Gospel of Many Colors (Crossway, 2013)',u:'https://www.crossway.org/books/joseph-and-the-gospel-of-the-many-colors-tpb/'}];

const K=(o)=>Object.assign({vt:'KJV',hid:1},o);
S.push(
K({id:'enoch',cat:'beg',t:'The Man Who Didn’t Die',ref:'Genesis 5:21–24',era:'Before the Flood',series:'Genesis',v:'And Enoch walked with God: and he was not; for God took him.',vr:'Genesis 5:24',s:'Genesis 5 is a long list of names, each ending with “and he died.” Then comes Enoch. He walked with God for 300 years, and one day he simply wasn’t there anymore. God took him.',h:['Enoch lived 365 years, one for every day of the year, and was the father of Methuselah, the longest-lived man in the Bible at 969.','Hebrews 11:5 says he was taken so that he would not see death. Only Elijah shares that honour.','A later Jewish writing called 1 Enoch (c. 300–100 BC) was popular in Jesus’ day, and the letter of Jude quotes from it.'],q:{q:'What happened to Enoch?',o:['He died at 969','God took him without dying','He built the ark'],a:1}}),
K({id:'babel',cat:'beg',t:'The Tower of Babel',ref:'Genesis 11',era:'Ancient Mesopotamia',series:'Genesis',v:'Let us make us a name.',vr:'Genesis 11:4',s:'Humanity speaks one language and decides to build a city and a tower reaching to heaven, to make a name for themselves. God comes down, confuses their language, and scatters them across the earth.',h:['Genesis says they used baked brick and tar instead of stone and mortar. That matches building in Mesopotamia, where stone was scarce.','Mesopotamian cities built huge stepped temple-towers called ziggurats. Babylon’s great ziggurat, Etemenanki, was dedicated to its god Marduk.','The name Babel sounds like the Hebrew word balal, “to confuse” (Genesis 11:9).'],q:{q:'What were they trying to make for themselves?',o:['A name','An army','A boat'],a:0}}),
K({id:'melchizedek',cat:'beg',t:'The Mystery King',ref:'Genesis 14:17–20',era:'c. 2000 BC',series:'Genesis',v:'And Melchizedek king of Salem brought forth bread and wine: and he was the priest of the most high God.',vr:'Genesis 14:18',s:'After Abram wins a battle, a king-priest appears from nowhere, with no family tree and no backstory. He brings bread and wine and blesses Abram, and Abram gives him a tenth of everything. Then he disappears from the story.',h:['His name means “king of righteousness.” Salem is usually identified with Jerusalem (Psalm 76:2).','This is the first tithe, a giving of a tenth, in the Bible.','Psalm 110:4 and Hebrews 7 present Jesus as a priest “after the order of Melchizedek.”'],q:{q:'What did Melchizedek bring Abram?',o:['Gold and silver','Bread and wine','A sword'],a:1}}),
K({id:'hagar',cat:'beg',t:'The God Who Sees',ref:'Genesis 16; 21',era:'c. 2000 BC',series:'Genesis',v:'Thou God seest me.',vr:'Genesis 16:13',s:'Hagar, an Egyptian slave, is used to give Abram a son, then mistreated and driven into the desert, pregnant and alone. The angel of the LORD finds her by a spring. She becomes the first person in the Bible to give God a name: the God who sees.',h:['Ancient marriage contracts, such as tablets from Nuzi in Mesopotamia, show a childless wife could give a servant to her husband to bear children.','Hagar’s name for God is El Roi, “the God who sees me.”','Her son Ishmael became the father of twelve tribes (Genesis 25:16), and Arab tradition looks back to him as an ancestor.'],q:{q:'What name did Hagar give God?',o:['The God who provides','The God who sees','The God of armies'],a:1}}),
K({id:'jacobwrestle',cat:'beg',t:'Wrestling with God',ref:'Genesis 32',era:'c. 1900–1700 BC',series:'Genesis',v:'I will not let thee go, except thou bless me.',vr:'Genesis 32:26',s:'The night before he faces the brother he cheated, Jacob is alone by a river. A mysterious man wrestles him until dawn. Jacob comes away limping, with a blessing and a new name: Israel.',h:['It happened at the Jabbok, a river in modern Jordan now called the Zarqa.','Jacob named the place Peniel, “face of God,” because he had seen God face to face and lived.','Because of the injury to Jacob’s hip, Israel traditionally does not eat the thigh muscle (Genesis 32:32).'],q:{q:'What new name was Jacob given?',o:['Abraham','Israel','Judah'],a:1}}),
K({id:'tamar',cat:'beg',t:'Judah and Tamar',ref:'Genesis 38',era:'c. 1700s BC',series:'Genesis',v:'She hath been more righteous than I.',vr:'Genesis 38:26',s:'In the middle of Joseph’s story, the Bible turns to his brother Judah. Twice widowed in his family and then abandoned by him, Tamar disguises herself to claim the child she was owed. When she is exposed, Judah’s own seal and staff prove that the guilty one is him.',h:['Under the custom later written in Deuteronomy 25, a dead man’s brother was to give his widow a son to carry on the family name.','A seal, cord and staff were a man’s personal ID, something like handing over your bank card today.','Tamar’s son Perez became an ancestor of King David, and Matthew 1:3 names her in Jesus’ family tree.'],q:{q:'What proved Judah was the father?',o:['A coat','His seal, cord and staff','A ring'],a:1},p:[{w:'Voddie Baucham',t:'Baucham drew two lessons that a church credits to him in its notes on this passage. Judah shows that you can live in the place of God’s promise without having its peace. And Tamar, a Canaanite woman in the line of Jesus, shows that God’s people have always been made up of many nations.',s:'As summarised in Grace Baptist Church’s sermon outline on Genesis 38',u:'https://grace-baptist-church.squarespace.com/sermon-outlines/2023/2/14/an-unlikely-story-of-redemption-genesis-38'}]}),
K({id:'midwives',cat:'exo',t:'Two Brave Midwives',ref:'Exodus 1:15–21',era:'c. 1500–1300 BC',series:'Exodus',v:'But the midwives feared God, and did not as the king of Egypt commanded them.',vr:'Exodus 1:17',s:'Pharaoh orders the Hebrew midwives Shiphrah and Puah to kill every baby boy at birth. They quietly refuse. When questioned, they tell him Hebrew women give birth too fast. God blesses them with families of their own.',h:['The Bible gives the names of these two midwives but never names the Pharaoh.','Egyptian women gave birth kneeling or squatting on birth bricks. The Hebrew word in Exodus 1:16 means “two stones.”','Their quiet refusal is among the earliest recorded acts of civil disobedience.'],q:{q:'What did the midwives do with Pharaoh’s order?',o:['Obeyed it','Refused it','Reported it to Moses'],a:1}}),
K({id:'nadab',cat:'exo',t:'Strange Fire',ref:'Leviticus 10',era:'Wilderness years',series:'Exodus',v:'I will be sanctified in them that come nigh me.',vr:'Leviticus 10:3',s:'On the very day Israel’s worship begins, Aaron’s sons Nadab and Abihu offer “strange fire” the LORD had not commanded. Fire comes out from the LORD and consumes them. Aaron is left in stunned silence.',h:['This happened right after the tabernacle was dedicated, at Israel’s most joyful moment.','Straight afterwards, God forbids priests to drink wine on duty (Leviticus 10:9), and some interpreters think the brothers were drunk.','Nadab and Abihu had seen God’s glory on Mount Sinai only months before (Exodus 24:9–10).'],q:{q:'Whose sons were Nadab and Abihu?',o:['Moses','Aaron','Joshua'],a:1}}),
K({id:'balaam',cat:'exo',t:'Balaam’s Talking Donkey',ref:'Numbers 22–24',era:'Wilderness years',series:'Exodus',v:'And the LORD opened the mouth of the ass.',vr:'Numbers 22:28',s:'A pagan seer named Balaam is hired to curse Israel. On the way, his donkey sees an angel with a drawn sword that Balaam can’t see, and she refuses to move. Balaam beats her, and she talks back. Every curse Balaam then tries comes out as a blessing.',h:['In 1967 archaeologists at Deir Alla in Jordan found a plaster inscription that names “Balaam son of Beor” as a seer of the gods. It is one of the earliest mentions of a Bible figure outside the Bible.','Balak, king of Moab, hired him because Moab was terrified of Israel’s numbers.','The New Testament mentions Balaam three times, including the donkey that rebuked him (2 Peter 2:16).'],q:{q:'Who saw the angel first?',o:['Balaam','The donkey','King Balak'],a:1},p:[{w:'Matthew Henry (1706)',t:'Henry saw the angel blocking Balaam’s road as a true friend, not an enemy: whoever stops us on a sinful path does us the greatest kindness. He thought Balaam’s confession was shallow and noted that people often leave sin only when sin leaves them.',s:'Matthew Henry’s Concise Commentary, Numbers 22',u:'https://biblehub.com/commentaries/mhc/numbers/22.htm'}]}),
K({id:'serpent',cat:'exo',t:'The Bronze Snake',ref:'Numbers 21:4–9',era:'Wilderness years',series:'Exodus',v:'Every one that is bitten, when he looketh upon it, shall live.',vr:'Numbers 21:8',s:'Israel complains again, and poisonous snakes bite the people. God tells Moses to make a bronze snake and lift it on a pole. Anyone bitten who looks at it lives.',h:['Centuries later the people had turned it into an idol called Nehushtan, so King Hezekiah smashed it (2 Kings 18:4).','At Timna in southern Israel, an ancient copper-mining area, archaeologists found a small copper snake in a Midianite shrine.','Jesus pointed to this story in John 3:14: “as Moses lifted up the serpent… even so must the Son of man be lifted up.”'],q:{q:'What did the bitten people have to do?',o:['Pray all night','Look at the bronze snake','Offer a sacrifice'],a:1}}),
K({id:'rahab',cat:'exo',t:'Rahab’s Scarlet Cord',ref:'Joshua 2; 6',era:'c. 1400–1200 BC',series:'Conquest',v:'And she bound the scarlet line in the window.',vr:'Joshua 2:21',s:'Two Israelite spies hide in the house of Rahab, a prostitute in Jericho. She lies to the king’s men and lowers the spies down the city wall with a rope. When Jericho falls, the scarlet cord in her window saves her whole family.',h:['Her house was built into the city wall itself (Joshua 2:15).','Rahab became the mother of Boaz, Ruth’s husband, so she is in Jesus’ family tree (Matthew 1:5).','Both Hebrews 11:31 and James 2:25 hold her up as an example of faith.'],q:{q:'What sign saved Rahab’s family?',o:['A lamp','A scarlet cord','A flag'],a:1}}),
K({id:'achan',cat:'exo',t:'Achan’s Hidden Loot',ref:'Joshua 7',era:'c. 1400–1200 BC',series:'Conquest',v:'I coveted them, and took them.',vr:'Joshua 7:21',s:'After Jericho, Israel loses badly to the tiny town of Ai. The cause: one man, Achan, secretly took forbidden plunder and buried it under his tent. One hidden sin brought defeat on the whole nation.',h:['He took a fine robe from Babylonia (Shinar), 200 shekels of silver and a 50-shekel bar of gold.','Ai means “the ruin,” and the town was small enough that Joshua first sent only about 3,000 men.','The place was named the Valley of Achor, “trouble.” Later Hosea 2:15 promises it will become “a door of hope.”'],q:{q:'Where did Achan hide the loot?',o:['In a cave','Under his tent','In a well'],a:1}}),
K({id:'ehud',cat:'jdg',t:'Ehud the Left-Handed',ref:'Judges 3:12–30',era:'c. 1300 BC',series:'Judges',v:'And Ehud put forth his left hand, and took the dagger from his right thigh.',vr:'Judges 3:21',s:'Israel is paying tribute to Eglon, the very fat king of Moab. Ehud delivers the tribute with a short sword strapped to his right thigh, where guards wouldn’t check. He asks for a private meeting with a “secret message from God,” and Israel is set free.',h:['Ehud was from the tribe of Benjamin, which means “son of the right hand.” Yet Judges 20:16 says Benjamin had 700 left-handed slingers who could hit a hair.','The dagger was about a forearm long, short enough to hide under his clothes.','The guards waited outside, thinking the king was using the toilet. That gave Ehud time to escape.'],q:{q:'Which hand did Ehud use?',o:['Right','Left','Both'],a:1}}),
K({id:'deborah',cat:'jdg',t:'Deborah and Jael',ref:'Judges 4–5',era:'c. 1200 BC',series:'Judges',v:'The LORD shall sell Sisera into the hand of a woman.',vr:'Judges 4:9',s:'Deborah, a prophetess, leads Israel from under a palm tree. When the general Barak won’t fight without her, she goes, but warns that a woman will get the glory. The enemy commander Sisera escapes the battle and hides in the tent of Jael, who kills him with a tent peg.',h:['Sisera had 900 iron chariots, the high-tech weapon of the day (Judges 4:3).','Deborah’s song in Judges 5 is thought to be one of the oldest pieces of Hebrew poetry.','The song says the river Kishon swept the enemy away (5:21), and a flood would have trapped the chariots in mud.'],q:{q:'How did Jael defeat Sisera?',o:['With a sword','With a tent peg','With poison'],a:1}}),
K({id:'gideon',cat:'jdg',t:'Gideon’s 300',ref:'Judges 6–7',era:'c. 1150 BC',series:'Judges',v:'The LORD is with thee, thou mighty man of valour.',vr:'Judges 6:12',s:'An angel calls Gideon a mighty warrior while he is hiding from raiders. He asks for sign after sign, including the famous fleece. Then God shrinks his army from 32,000 to 300 men, armed with trumpets, jars and torches, so that no one can boast it was their own strength.',h:['Gideon was threshing wheat in a winepress, a pit, to hide it from the Midianites (6:11).','The Midianite raiders rode camels, one of the earliest records of camels used in war.','The 300 were chosen by how they drank water from the stream (7:5–7).'],q:{q:'How many men did Gideon finally fight with?',o:['3,000','300','30'],a:1},p:[{w:'John MacArthur',t:'MacArthur paired Gideon and Samson as two opposite stories: Gideon moves from weakness to strength, while Samson moves from strength to weakness. Yet God used both men to protect his people.',s:'Grace to You sermon on Gideon and Samson',u:'https://www.gty.org/resources/sermons/80-390'}]}),
K({id:'jephthah',cat:'jdg',t:'Jephthah’s Rash Vow',ref:'Judges 11',era:'c. 1100 BC',series:'Judges',v:'I have opened my mouth unto the LORD, and I cannot go back.',vr:'Judges 11:35',s:'Jephthah, an outcast son of a prostitute, is called back to lead Israel in war. Before the battle, he vows to offer to God whatever first comes out of his house to meet him. He wins, and his only daughter runs out dancing to greet him.',h:['His own brothers had driven him out of the family (11:1–2).','For four days every year, the young women of Israel remembered his daughter (11:40).','What happened to her is debated. Some read it as a literal sacrifice. Others think she was devoted to God and never married.'],q:{q:'Who came out first to meet Jephthah?',o:['His servant','His daughter','A goat'],a:1},p:[{w:'Matthew Henry (1706)',t:'Henry thought Jephthah probably did not burn his daughter as an offering, because God hates human sacrifice. He leaned toward the view that she lived out her life unmarried and set apart, though he admitted scholars disagree.',s:'Matthew Henry’s Concise Commentary, Judges 11',u:'https://biblehub.com/commentaries/mhc/judges/11.htm'}]}),
K({id:'samson',cat:'jdg',t:'Samson’s Last Prayer',ref:'Judges 13–16',era:'c. 1100 BC',series:'Judges',v:'He wist not that the LORD was departed from him.',vr:'Judges 16:20',s:'Samson has superhuman strength and almost no self-control. Delilah wears him down until he reveals the secret of his hair. Blinded and enslaved, he prays one last time and pulls down the Philistine temple with his own hands.',h:['He was a Nazirite from birth, which meant no razor, no wine and no touching dead bodies (Numbers 6).','A Philistine temple excavated at Tell Qasile had two central pillars holding up its roof, much like the one Samson pushed apart.','Grinding grain at a mill was the work of slaves, so it was a deep humiliation for a hero.'],q:{q:'What did Samson do in his final moment?',o:['Escaped','Pulled down the temple','Killed Delilah'],a:1},p:[{w:'John MacArthur',t:'MacArthur noted that Samson’s story runs from strength to weakness, the reverse of Gideon’s. Even so, Hebrews 11 lists him among the faithful, a picture of God using deeply flawed people.',s:'Grace to You sermon on Gideon and Samson',u:'https://www.gty.org/resources/sermons/80-390'}]}),
K({id:'hannah',cat:'kng',t:'Hannah’s Silent Prayer',ref:'1 Samuel 1–2',era:'c. 1100 BC',series:'Road to the throne',v:'For this child I prayed.',vr:'1 Samuel 1:27',s:'Hannah can’t have children, and her rival mocks her every year. At the tabernacle she prays so hard that only her lips move, and the priest Eli thinks she’s drunk. God answers, and she gives her son Samuel back to serve the LORD.',h:['The tabernacle stood at Shiloh in those days. Archaeologists have excavated the site in the hills north of Jerusalem.','Hannah’s song (1 Samuel 2) has strong echoes in Mary’s song in Luke 1.','Samuel grew up to anoint Israel’s first two kings, Saul and David.'],q:{q:'What did Eli think when he saw Hannah praying?',o:['That she was drunk','That she was a prophet','That she was ill'],a:0}}),
K({id:'dagon',cat:'kng',t:'The Ark vs. Dagon',ref:'1 Samuel 5–6',era:'c. 1050 BC',series:'Road to the throne',v:'Dagon was fallen upon his face to the earth before the ark of the LORD.',vr:'1 Samuel 5:3',s:'The Philistines capture the Ark of the Covenant and set it in the temple of their god Dagon as a trophy. In the morning Dagon is face-down before it. The next morning his head and hands are broken off. Plagues spread until the Philistines send the ark home.',h:['Dagon was an ancient god known from texts at Ebla and Ugarit in Syria, mostly linked with grain. The old idea that he was a fish-god is now widely doubted.','The Philistines sent it back on a cart pulled by two cows, with golden models of tumours and mice as a guilt offering (6:4).','This happened in Ashdod, one of the five Philistine cities.'],q:{q:'What happened to Dagon’s statue?',o:['It vanished','It fell face-down before the ark','It caught fire'],a:1}}),
K({id:'ebenezer',cat:'kng',t:'Here I Raise My Ebenezer',ref:'1 Samuel 7',era:'c. 1050 BC',series:'Road to the throne',v:'Hitherto hath the LORD helped us.',vr:'1 Samuel 7:12',s:'Twenty years after losing the ark, Israel turns back to God. As the Philistines attack, God thunders from heaven and they flee. Samuel sets up a stone and names it Ebenezer, “stone of help.”',h:['Ebenezer means “stone of help.” It stood near the place where Israel had lost the ark years before (1 Samuel 4:1).','The 1758 hymn “Come, Thou Fount of Every Blessing” has the line “Here I raise my Ebenezer.”','Stones were a common way to mark a memory in Israel (compare Joshua 4).'],q:{q:'What does Ebenezer mean?',o:['Stone of help','House of God','Rock of ages'],a:0},p:[{w:'Charles Spurgeon',t:'Spurgeon chose this verse for his 500th published sermon, as a way of looking back with thanks. His point: count the ways God has already helped you, and let that past help give you courage for what lies ahead.',s:'Sermon No. 500, “Ebenezer!” (1863)',u:'https://biblegateway.com/devotionals/spurgeon-365-2/2026/03/15'}]}),
K({id:'endor',cat:'kng',t:'Saul and the Medium of Endor',ref:'1 Samuel 28',era:'c. 1010 BC',series:'Road to the throne',v:'Seek me a woman that hath a familiar spirit.',vr:'1 Samuel 28:7',s:'God no longer answers King Saul. Desperate before a battle, he disguises himself and visits a medium, something he himself had banned. To her horror, the prophet Samuel appears and tells Saul he will die the next day.',h:['Saul had earlier expelled mediums from the land (28:3), so he was breaking his own law.','The woman screamed when Samuel appeared (28:12), as if this was not what she expected.','Interpreters have long debated whether it was really Samuel. 1 Chronicles 10:13 lists consulting a medium as one reason Saul died.'],q:{q:'Who appeared to Saul?',o:['David','Samuel','An angel'],a:1}}),
K({id:'abigail',cat:'kng',t:'Abigail Stops a Massacre',ref:'1 Samuel 25',era:'c. 1015 BC',series:'Road to the throne',v:'Blessed be thy advice, and blessed be thou, which hast kept me this day from coming to shed blood.',vr:'1 Samuel 25:33',s:'Nabal, a rich and rude farmer, insults David and his 600 men. David straps on his sword to wipe out the household. Nabal’s wife Abigail rides out with food and wise words and talks David out of murder.',h:['Nabal’s name means “fool,” and Abigail says so herself (25:25).','She brought 200 loaves, two skins of wine, five sheep, grain, 100 clusters of raisins and 200 fig cakes (25:18).','Ten days later Nabal died, and Abigail became David’s wife.'],q:{q:'What does Nabal’s name mean?',o:['Rich','Fool','Shepherd'],a:1}}),
K({id:'mephibosheth',cat:'kng',t:'A Seat at the King’s Table',ref:'2 Samuel 9',era:'c. 1000 BC',series:'Road to the throne',v:'Thou shalt eat bread at my table continually.',vr:'2 Samuel 9:7',s:'New kings usually wiped out the old king’s family. Instead, David searches for anyone left from Saul’s house to show kindness to. He finds Jonathan’s disabled son Mephibosheth, hiding in a nowhere town, and gives him land and a permanent seat at the royal table.',h:['He became lame at age five when his nurse dropped him as she fled after news of Saul and Jonathan’s death (2 Samuel 4:4).','He was living in Lo-debar, a name often explained as “no pasture,” a nowhere place.','He called himself a “dead dog” before David (9:8), the lowest insult of the day.'],q:{q:'Whose son was Mephibosheth?',o:['Saul','Jonathan','Absalom'],a:1},p:[{w:'Charles Spurgeon',t:'Spurgeon pointed out that Mephibosheth was no ornament to a royal table, yet he ate there always because David saw in his face the features of his beloved friend Jonathan. In the same way, God welcomes believers for the sake of Christ, whose likeness he sees in them.',s:'Morning and Evening, 27 May (morning)',u:'https://ccel.org/ccel/spurgeon/morneve.d0527am.html'}]}),
K({id:'uzzah',cat:'kng',t:'Uzzah Touches the Ark',ref:'2 Samuel 6',era:'c. 1000 BC',series:'Road to the throne',v:'God smote him there for his error.',vr:'2 Samuel 6:7',s:'David brings the ark to Jerusalem with a huge celebration, riding on a brand-new cart. The oxen stumble, Uzzah reaches out to steady it, and he dies on the spot. David is angry and afraid, and the parade stops.',h:['God’s law said Levites must carry the ark on poles, not move it on a cart (Numbers 4:15).','The cart copied how the Philistines had sent the ark back (1 Samuel 6:7).','Three months later David tried again the right way, with Levites carrying it, and danced before the LORD (1 Chronicles 15:13–15).'],q:{q:'How should the ark have been carried?',o:['On a cart','On poles by Levites','On a camel'],a:1}}),
K({id:'rizpah',cat:'kng',t:'Rizpah’s Long Vigil',ref:'2 Samuel 21:1–14',era:'c. 990 BC',series:'Road to the throne',v:'Rizpah… took sackcloth, and spread it for her upon the rock.',vr:'2 Samuel 21:10',s:'Seven of Saul’s descendants are executed to answer for Saul’s crime against the Gibeonites, including Rizpah’s two sons. Their bodies are left unburied. For months, Rizpah camps on a rock beside them, chasing off birds by day and animals by night, until King David hears of it and finally gives them all an honourable burial.',h:['Saul had broken Israel’s old treaty with the Gibeonites from Joshua’s time (Joshua 9).','She kept watch from the start of the barley harvest until the rains came, which could mean months.','Her devotion moved David to bury the bones of Saul and Jonathan too (21:12–14).'],q:{q:'What did Rizpah do?',o:['Fled the country','Guarded her sons’ bodies','Rebuilt Gibeon'],a:1},p:[{w:'Charles Spurgeon',t:'Spurgeon pictured Rizpah enduring heat, rain and sleepless nights out of love for her sons. He asked whether we, who owe far more to Christ, will give up at the first small trial, and he urged believers to chase off distracting thoughts the way she drove off the birds.',s:'Morning and Evening, 31 March (evening)',u:'https://www.biblegateway.com/devotionals/morning-and-evening/2024/03/31'}]}),
K({id:'jabez',cat:'kng',t:'The Prayer of Jabez',ref:'1 Chronicles 4:9–10',era:'Tribe of Judah',series:'Road to the throne',v:'Oh that thou wouldest bless me indeed.',vr:'1 Chronicles 4:10',s:'In the middle of nine chapters of names, one man gets a story. His mother called him Jabez, which sounds like “pain,” because his birth was so hard. He asks God to bless him, enlarge his territory and keep him from harm, and God grants his request.',h:['It is two verses tucked into a family list in 1 Chronicles.','“Jabez” sounds like the Hebrew word for pain or sorrow.','Bruce Wilkinson’s little book The Prayer of Jabez (2000) sold millions of copies.'],q:{q:'What does Jabez’s name sound like?',o:['Joy','Pain','Strength'],a:1},p:[{w:'Charles Spurgeon',t:'Preaching on this verse in 1871, Spurgeon put the weight on the word “indeed.” Blessings from people are pleasant but thin. Only God’s blessing is real, lasting and soul-deep, so he urged believers to make this prayer a lifelong one.',s:'Sermon No. 994, “The Prayer of Jabez” (1871)',u:'https://www.spurgeon.org/sermons/the-prayer-of-jabez'}]}),
K({id:'hezekiah',cat:'kng',t:'Hezekiah’s Secret Tunnel',ref:'2 Kings 18–20; 2 Chronicles 32',era:'c. 701 BC',series:'Kings of Judah',v:'He made a pool, and a conduit, and brought water into the city.',vr:'2 Kings 20:20',s:'The mighty Assyrian army is coming. King Hezekiah has a tunnel cut through solid rock to bring spring water inside Jerusalem’s walls. When the Assyrians surround the city, Hezekiah spreads their threatening letter before the LORD, and the siege fails.',h:['The tunnel still exists: about 533 m long, cut by two teams who met in the middle. You can walk through it today.','The Siloam Inscription, found in the tunnel in 1880, describes the moment the two teams met. It is now in Istanbul.','Sennacherib’s own records boast that he shut Hezekiah up “like a bird in a cage” but never claim he took Jerusalem.'],q:{q:'What did Hezekiah’s tunnel carry?',o:['Soldiers','Water','Treasure'],a:1}}),
K({id:'josiah',cat:'kng',t:'The Lost Book Found',ref:'2 Kings 22–23',era:'622 BC',series:'Kings of Judah',v:'I have found the book of the law in the house of the LORD.',vr:'2 Kings 22:8',s:'During temple repairs, the high priest finds a scroll of God’s law that had been lost and forgotten. When it is read to young King Josiah, he tears his clothes in grief. He leads the nation in the biggest reform in its history.',h:['Josiah became king at just eight years old (22:1).','Many scholars think the scroll was some form of Deuteronomy.','Josiah died at Megiddo in 609 BC, fighting Pharaoh Necho of Egypt.'],q:{q:'How old was Josiah when he became king?',o:['8','18','30'],a:0}}),
K({id:'zarephath',cat:'pro',t:'The Widow’s Last Meal',ref:'1 Kings 17',era:'c. 870 BC',series:'Prophets',v:'The barrel of meal wasted not, neither did the cruse of oil fail.',vr:'1 Kings 17:16',s:'In a drought, Elijah asks a starving widow for bread. She has just enough flour and oil for one last meal for her and her son. She feeds the prophet first, and her jar never runs empty. Later Elijah raises her son from death.',h:['Zarephath was near Sidon, the homeland of Queen Jezebel, Baal’s home territory.','Jesus told this story in his hometown sermon (Luke 4:25–26), and the crowd tried to kill him.','This is the first account in the Bible of someone being raised from the dead.'],q:{q:'What never ran out?',o:['Water and wine','Flour and oil','Bread and fish'],a:1}}),
K({id:'naaman',cat:'pro',t:'Naaman Dips Seven Times',ref:'2 Kings 5',era:'c. 850 BC',series:'Prophets',v:'His flesh came again like unto the flesh of a little child, and he was clean.',vr:'2 Kings 5:14',s:'Naaman, a mighty Syrian general, has leprosy. A captured Israelite slave girl tells him about the prophet Elisha. Elisha won’t even come out to meet him and just says to wash seven times in the Jordan. Naaman storms off insulted, until his servants talk him round.',h:['Naaman thought Damascus’ rivers, the Abana and Pharpar, were better than Israel’s muddy Jordan (5:12).','He took two mule-loads of Israel’s soil home so he could worship the LORD on it (5:17).','Jesus mentions Naaman in Luke 4:27 as a foreigner God healed.'],q:{q:'How many times did Naaman wash?',o:['Three','Seven','Twelve'],a:1},p:[{w:'Charles Spurgeon',t:'Spurgeon used Naaman to expose human pride: we would gladly do some great thing to be saved, yet we stumble over God’s simple command to wash and be clean, which for him meant simply trusting Christ.',s:'Sermon No. 892, “A Serious Reprimand”',u:'https://ccel.org/ccel/spurgeon/sermons15.xlv.html'},{w:'Alexander Maclaren',t:'Maclaren summed it up neatly: Naaman wanted to be treated as a great man who happened to be a leper, but Elisha treated him as a leper who happened to be a great man. God’s cure puts everyone on the same level.',s:'“Naaman’s Wrath”',u:'https://www.ccel.org/ccel/maclaren/deut.iii.iv.vii.html'}]}),
K({id:'axehead',cat:'pro',t:'The Floating Axe Head',ref:'2 Kings 6:1–7',era:'c. 850 BC',series:'Prophets',v:'And the iron did swim.',vr:'2 Kings 6:6',s:'Elisha’s students are cutting timber by the Jordan when an axe head flies off into the river. “Oh no, it was borrowed!” cries the young man. Elisha throws a stick in, and the iron floats up.',h:['Iron tools were costly then, and God’s law said a borrower had to make good what he lost (Exodus 22:14).','The “sons of the prophets” were a community of trainee prophets who learned under Elijah and Elisha.','It is one of the smallest miracles in the Bible: God caring about a young man’s borrowed tool.'],q:{q:'Why was the young man so upset?',o:['The axe was borrowed','He was hurt','The river flooded'],a:0},p:[{w:'Charles Spurgeon',t:'Spurgeon used this tiny miracle to encourage anyone in a hopeless situation: what seems sunk beyond recovery can rise when God acts. He applied it to impossible tasks, money troubles and hard hearts, telling readers to bring their desperate case to God in faith.',s:'Morning and Evening, 13 January (evening)',u:'https://ccel.org/ccel/spurgeon/morneve.d0113pm.html'}]}),
K({id:'dothan',cat:'pro',t:'The Hills Full of Fire',ref:'2 Kings 6:8–23',era:'c. 850 BC',series:'Prophets',v:'Fear not: for they that be with us are more than they that be with them.',vr:'2 Kings 6:16',s:'The king of Syria sends an army by night to capture Elisha. His servant wakes up to see the city surrounded and panics. Elisha prays, “LORD, open his eyes,” and the hills are full of horses and chariots of fire.',h:['Dothan is the same place where Joseph’s brothers sold him, centuries earlier (Genesis 37:17).','Elisha then led the blinded army into Samaria and had the king feed them instead of killing them (6:22–23).','After that feast, the Syrian raids stopped for a while (6:23).'],q:{q:'What did the servant see when his eyes were opened?',o:['Angels singing','Horses and chariots of fire','A rainbow'],a:1}}),
K({id:'lepers',cat:'pro',t:'Four Lepers at the Gate',ref:'2 Kings 7',era:'c. 850 BC',series:'Prophets',v:'This day is a day of good tidings, and we hold our peace.',vr:'2 Kings 7:9',s:'Samaria is starving under siege. Four lepers outside the gate decide they will die anyway, so they walk into the enemy camp. It is empty: God made the Syrians hear a huge army and flee. After feasting, the lepers realise they can’t keep good news to themselves.',h:['The famine was so severe that a donkey’s head sold for 80 shekels of silver (6:25).','Lepers had to live outside the town (Leviticus 13:46).','God made the Syrians hear the sound of chariots and horses that weren’t there (7:6).'],q:{q:'What did the lepers find in the enemy camp?',o:['A trap','An empty camp full of food','The king'],a:1}}),
K({id:'bones',cat:'pro',t:'Elisha’s Bones',ref:'2 Kings 13:20–21',era:'c. 800 BC',series:'Prophets',v:'He revived, and stood up on his feet.',vr:'2 Kings 13:21',s:'Elisha has died and been buried. Some men are burying another man when raiders appear, so they toss the body into Elisha’s tomb and run. When the dead man touches Elisha’s bones, he comes back to life and stands up.',h:['Elisha had asked Elijah for a “double portion” of his spirit (2 Kings 2:9), and the Bible records about twice as many miracles for him.','It is the only miracle in the Bible worked through a dead prophet’s body.','The raiders were bands from Moab who crossed the border each spring.'],q:{q:'What brought the dead man back to life?',o:['Elisha’s prayer','Touching Elisha’s bones','Holy water'],a:1}}),
K({id:'hosea',cat:'pro',t:'Hosea Buys Back His Wife',ref:'Hosea 1–3',era:'c. 750 BC',series:'Prophets',v:'Go yet, love a woman beloved of her friend, yet an adulteress.',vr:'Hosea 3:1',s:'God tells the prophet Hosea to marry Gomer, who will be unfaithful to him. She leaves him and ends up for sale. God tells Hosea to go and buy her back and love her again, a living picture of God’s love for unfaithful Israel.',h:['Hosea preached to the northern kingdom shortly before Assyria destroyed its capital, Samaria, in 722 BC.','The children’s names were messages: Jezreel, Lo-ruhamah (“not pitied”) and Lo-ammi (“not my people”).','He paid 15 shekels of silver plus barley (3:2), roughly the price of a slave (compare Exodus 21:32).'],q:{q:'What did God tell Hosea to do after Gomer left?',o:['Divorce her','Buy her back','Move away'],a:1},p:[{w:'A common sermon point',t:'Many preachers make the same turn on this book: we may relate to hurting Hosea, but the main point is that we are Gomer. We are the faithless ones, and God is the faithful husband who pays to bring us home.',s:'Example: sermon on Hosea, SermonAudio',u:'https://www.sermonaudio.com/sermons/6122090523675'},{w:'John Calvin',t:'Calvin was among those who read Hosea’s marriage as a prophetic vision or parable rather than events that literally happened, a view some still hold today.',s:'Noted in a sermon on Hosea, Logos Sermons',u:'https://sermons.logos.com/sermons/1198758-hosea:-wife-and-nation'}]}),
K({id:'ebedmelech',cat:'exi',t:'The Man Who Pulled Jeremiah Out',ref:'Jeremiah 38–39',era:'c. 588 BC',series:'Exile & return',v:'Because thou hast put thy trust in me, saith the LORD.',vr:'Jeremiah 39:18',s:'The prophet Jeremiah is thrown into a muddy cistern to die. Everyone stays silent, except Ebed-Melech, a foreign court official from Cush (Ethiopia). He goes to the king, gathers 30 men, and lowers old rags so the ropes won’t cut Jeremiah’s arms.',h:['Jeremiah had sunk into the mud at the bottom of the cistern (38:6).','Cush was the region south of Egypt, roughly Sudan and southern Egypt today.','God promised Ebed-Melech that he would survive when Babylon destroyed Jerusalem in 586 BC (39:15–18).'],q:{q:'Where was Ebed-Melech from?',o:['Babylon','Cush (Ethiopia)','Egypt'],a:1}}),
K({id:'drybones',cat:'exi',t:'The Valley of Dry Bones',ref:'Ezekiel 37',era:'c. 580 BC',series:'Exile & return',v:'O ye dry bones, hear the word of the LORD.',vr:'Ezekiel 37:4',s:'In a vision, Ezekiel stands in a valley full of bones, very dry. God asks, “Can these bones live?” Ezekiel speaks God’s word, and the bones rattle together, grow flesh and stand up as a great army when breath enters them.',h:['Ezekiel was a priest taken to Babylon in the exile of 597 BC.','The vision answers the exiles’ own words: “Our bones are dried, and our hope is lost” (37:11).','In Hebrew, the same word ruach means breath, wind and spirit, and it runs all through the chapter.'],q:{q:'What did God ask Ezekiel?',o:['Can these bones live?','Who killed them?','Where is the army?'],a:0}}),
K({id:'belshazzar',cat:'exi',t:'The Writing on the Wall',ref:'Daniel 5',era:'539 BC',series:'Daniel',v:'Thou art weighed in the balances, and art found wanting.',vr:'Daniel 5:27',s:'King Belshazzar throws a drunken feast, drinking from the sacred cups taken from Jerusalem’s temple. A hand appears and writes on the wall. Only Daniel can read it: the kingdom is finished. That very night Babylon falls.',h:['Critics once said Belshazzar never existed, until the Nabonidus Cylinder, found in the 1850s, named him as the eldest son of King Nabonidus.','He offered Daniel “third ruler” in the kingdom (5:16), because Nabonidus and Belshazzar were already first and second.','Babylon fell to Cyrus of Persia in 539 BC. Greek historians said his army got in by diverting the river.'],q:{q:'Who read the writing on the wall?',o:['Belshazzar','Daniel','Nebuchadnezzar'],a:1}})
);

const byIdRaw=id=>S.find(s=>s.id===id);
// ---- Episode series + more stories (verses KJV unless marked) ----
const E=(o)=>Object.assign({vt:'KJV'},o);
Object.assign(byIdRaw('joseph'),{t:'“I Am Joseph”',ref:'Genesis 45–50',era:'c. 1700s BC',s:'Joseph sends all the Egyptians out of the room and weeps so loudly the whole palace hears. “I am Joseph,” he tells his brothers. They are terrified he will take revenge. Instead he forgives them: what they meant for evil, God meant for good.'});
Object.assign(byIdRaw('esther'),{t:'For Such a Time as This',s:'Haman, the king’s top official, gets a royal decree to wipe out every Jew in the empire. Mordecai tells Esther she may have become queen for exactly this moment. Anyone who went to the king without being called could be put to death. Esther fasts for three days and says, “If I perish, I perish.”'});
S.push(
E({id:'joseph1',cat:'beg',t:'The Dreamer in the Pit',ref:'Genesis 37',era:'c. 1700s BC',v:'Behold, this dreamer cometh.',vr:'Genesis 37:19',s:'Jacob’s favourite son Joseph dreams that his family will bow down to him, and he tells them. His jealous brothers throw him into a dry pit, dip his coat in goat’s blood to fool their father, and sell him to traders heading for Egypt.',h:['Joseph was sold for 20 pieces of silver. Scholars such as Kenneth Kitchen note that this matches slave prices of roughly that era.','The traders were carrying spices, balm and myrrh down to Egypt (37:25), a real caravan trade of the time.','Reuben, the eldest brother, had secretly planned to rescue Joseph later (37:22).'],q:{q:'How much was Joseph sold for?',o:['20 pieces of silver','30 pieces of silver','A camel'],a:0}}),
E({id:'joseph2',cat:'beg',t:'Framed in Potiphar’s House',ref:'Genesis 39–40',era:'c. 1700s BC',v:'And the LORD was with Joseph, and he was a prosperous man.',vr:'Genesis 39:2',s:'As a slave, Joseph rises to run his master Potiphar’s whole household. When Potiphar’s wife tries to seduce him, he runs, leaving his cloak in her hand. She cries rape, and he is thrown into prison. There he correctly explains the dreams of two of Pharaoh’s officials.',h:['Potiphar was “captain of the guard,” a senior royal officer.','An Egyptian story from about the 1200s BC, the Tale of Two Brothers, has a very similar plot of a false accusation by a wife.','Cupbearer and chief baker were real court posts, trusted with the king’s food and drink.'],q:{q:'Who forgot about Joseph after leaving prison?',o:['The baker','The cupbearer','Potiphar'],a:1}}),
E({id:'joseph3',cat:'beg',t:'From Prison to Palace',ref:'Genesis 41',era:'c. 1700s BC',v:'It is not in me: God shall give Pharaoh an answer of peace.',vr:'Genesis 41:16',s:'Pharaoh dreams of seven fat cows eaten by seven skinny ones, and no one can explain it. The cupbearer finally remembers Joseph. Joseph explains the dream: seven years of plenty, then seven of famine. In one day he goes from prisoner to the second most powerful man in Egypt.',h:['Joseph was given an Egyptian name, Zaphnath-paaneah, and married Asenath, daughter of a priest of On (Heliopolis) (41:45).','A signet ring, fine linen and a gold chain (41:42) match scenes of officials being honoured in Egyptian tomb paintings.','Joseph was 30 years old when he entered Pharaoh’s service (41:46), about 13 years after he was sold.'],q:{q:'What did the seven skinny cows mean?',o:['Seven years of war','Seven years of famine','Seven plagues'],a:1}}),
E({id:'joseph4',cat:'beg',t:'The Brothers Bow Down',ref:'Genesis 42–44',era:'c. 1700s BC',v:'Let thy servant abide instead of the lad a bondman to my lord.',vr:'Genesis 44:33',s:'The famine drives Joseph’s brothers to Egypt to buy grain. They bow before him, just as in his dream, without recognising him. He tests them by planting his silver cup in young Benjamin’s sack. Judah, the brother who suggested selling Joseph, now offers to become a slave in Benjamin’s place.',h:['Joseph spoke to them through an interpreter so they wouldn’t know he understood Hebrew (42:23).','The silver cup was said to be used for divination (44:5). Egyptians did practise reading patterns in liquid in a cup.','Judah had proposed selling Joseph years before (37:26–27). His change of heart is the turning point of the whole saga.'],q:{q:'Who offered to become a slave instead of Benjamin?',o:['Reuben','Judah','Simeon'],a:1}}),
E({id:'david1',cat:'kng',t:'The Forgotten Son',ref:'1 Samuel 16',era:'c. 1025 BC',v:'For man looketh on the outward appearance, but the LORD looketh on the heart.',vr:'1 Samuel 16:7',s:'God sends Samuel to Bethlehem to anoint a new king from among Jesse’s sons. Seven tall sons pass by, and God rejects them all. “Are there any more?” The youngest, David, is out with the sheep. He is called in and anointed while his brothers watch.',h:['David was the youngest of Jesse’s eight sons (17:12–14).','Kings were anointed with oil. The Hebrew word for “anointed one” is mashiach, which gives us “Messiah.”','David then joined Saul’s court as a harp player whose music calmed the troubled king (16:23).'],q:{q:'What does God look at, according to 1 Samuel 16:7?',o:['Strength','The heart','Family line'],a:1}}),
E({id:'david3',cat:'kng',t:'Spared in the Cave',ref:'1 Samuel 24',era:'c. 1014 BC',v:'The LORD forbid that I should do this thing unto my master, the LORD’s anointed.',vr:'1 Samuel 24:6',s:'King Saul hunts David with 3,000 soldiers. Saul steps alone into a dark cave to relieve himself, the very cave where David and his men are hiding. David’s men say this is his chance. David creeps up, cuts off a corner of Saul’s robe, and lets him go.',h:['This happened at En-gedi, an oasis by the Dead Sea full of caves, near the “rocks of the wild goats” (24:2). Ibex still live there.','Cutting the hem of a king’s robe may have symbolised taking his authority, which is perhaps why David felt guilty even for that (24:5).','Saul wept and admitted, “Thou art more righteous than I” (24:17).'],q:{q:'What did David take from Saul?',o:['His spear','A corner of his robe','His crown'],a:1}}),
E({id:'david4',cat:'kng',t:'“Thou Art the Man”',ref:'2 Samuel 11–12',era:'c. 995 BC',v:'And Nathan said to David, Thou art the man.',vr:'2 Samuel 12:7',s:'From his roof, King David sees Bathsheba bathing. He sleeps with her, and she becomes pregnant. To cover it up, he arranges for her husband Uriah, one of his most loyal soldiers, to be killed in battle. The prophet Nathan tells David a story about a rich man who stole a poor man’s only lamb. David is furious, until Nathan says, “You are the man.”',h:['Uriah was a Hittite and one of David’s elite “mighty men” (2 Samuel 23:39).','Psalm 51, “Create in me a clean heart,” is titled as David’s prayer after Nathan confronted him.','Matthew 1:6 names Bathsheba in Jesus’ family tree as “her that had been the wife of Urias.”'],q:{q:'Who confronted David?',o:['Samuel','Nathan','Joab'],a:1}}),
E({id:'david5',cat:'kng',t:'Absalom, My Son',ref:'2 Samuel 15–18',era:'c. 980 BC',v:'O my son Absalom, my son, my son Absalom! would God I had died for thee.',vr:'2 Samuel 18:33',s:'David’s handsome son Absalom wins the people’s hearts and seizes the throne. David flees Jerusalem weeping. In the battle that follows, Absalom’s head catches in an oak tree, and David’s general kills him. David, who wanted his son spared, breaks down in grief.',h:['Absalom “stole the hearts” of Israel by meeting people at the city gate and promising them justice (15:6).','He was famous for his hair, which he cut once a year and which weighed 200 shekels, about 2.3 kg (14:26).','David fled up the Mount of Olives barefoot and weeping (15:30), the same hill where Jesus later prayed.'],q:{q:'How was Absalom caught in battle?',o:['In a trap','His head caught in a tree','By a spear'],a:1}}),
E({id:'elijah1',cat:'pro',t:'Fed by Ravens',ref:'1 Kings 17:1–7',era:'c. 870 BC',v:'And the ravens brought him bread and flesh in the morning, and bread and flesh in the evening.',vr:'1 Kings 17:6',s:'Elijah walks into wicked King Ahab’s court and announces that there will be no rain until he says so. Then God hides him by a brook in the wilderness, where ravens bring him food twice a day.',h:['The drought lasted three and a half years (Luke 4:25; James 5:17).','Ravens were “unclean” birds under the law (Leviticus 11:15), unlikely waiters for a prophet.','Ahab had married Jezebel, a Sidonian princess, and built a temple to Baal in Samaria (16:31–32).'],q:{q:'Who brought Elijah food?',o:['Angels','Ravens','A widow'],a:1}}),
E({id:'elijah4',cat:'pro',t:'The Chariot of Fire',ref:'2 Kings 2',era:'c. 850 BC',v:'And Elijah went up by a whirlwind into heaven.',vr:'2 Kings 2:11',s:'Elijah knows his time is up. Three times he tells Elisha to stay behind, and three times Elisha refuses to leave him. Elijah parts the Jordan with his cloak. Then a chariot and horses of fire separate them, and Elijah is taken up in a whirlwind. Elisha picks up the fallen cloak.',h:['Elisha asked for a “double portion” of Elijah’s spirit, the share a firstborn son inherited (Deuteronomy 21:17).','Malachi 4:5 promised that Elijah would come again. Jesus said John the Baptist fulfilled this (Matthew 11:14).','Elijah appears with Moses at Jesus’ transfiguration (Matthew 17:3).'],q:{q:'How did Elijah leave the earth?',o:['He died of old age','In a whirlwind','By ship'],a:1}}),
E({id:'esther1',cat:'exi',t:'The Queen Who Said No',ref:'Esther 1–2',era:'c. 483 BC',v:'But the queen Vashti refused to come at the king’s commandment.',vr:'Esther 1:12',s:'At the end of a months-long party, the drunk king orders Queen Vashti to come and show off her beauty to his guests. She refuses, and she loses her crown. A search for a new queen begins across the empire, and an orphaned Jewish girl named Hadassah, known as Esther, is chosen.',h:['The empire stretched over 127 provinces “from India even unto Ethiopia” (1:1).','The king’s display of wealth lasted 180 days, followed by a seven-day feast (1:4–5).','Esther was raised by her cousin Mordecai, who told her to keep her Jewish identity secret (2:10).'],q:{q:'Who refused the king’s command?',o:['Esther','Vashti','Mordecai'],a:1}}),
E({id:'esther3',cat:'exi',t:'The Night the King Couldn’t Sleep',ref:'Esther 5–6',era:'c. 474 BC',v:'On that night could not the king sleep.',vr:'Esther 6:1',s:'Haman builds a giant gallows to hang Mordecai. That same night the king can’t sleep, so he has the royal records read to him. He discovers that Mordecai once saved his life and was never rewarded. The next morning Haman is forced to lead Mordecai through the city in royal robes.',h:['Persian kings kept official chronicles. The Greek historian Herodotus describes Xerxes having the names of men who served him well written down.','Haman had to call out before Mordecai, “Thus shall it be done unto the man whom the king delighteth to honour” (6:11).','Haman’s own wife predicted his fall that same day (6:13).'],q:{q:'What did the sleepless king have read to him?',o:['Poetry','The royal records','Letters from Esther'],a:1}}),
E({id:'esther4',cat:'exi',t:'Haman’s Gallows',ref:'Esther 7–10',era:'c. 473 BC',v:'So they hanged Haman on the gallows that he had prepared for Mordecai.',vr:'Esther 7:10',s:'At her second banquet, Esther finally names the enemy who plans to destroy her people: “this wicked Haman.” The king storms out in rage. Haman is hanged on the gallows he built for Mordecai, and the Jews are allowed to defend themselves.',h:['The gallows was 50 cubits, about 23 m, high (5:14).','Purim takes its name from pur, “lot,” because Haman cast lots to pick the day of slaughter (3:7; 9:24).','Mordecai became second in rank only to the king (10:3).'],q:{q:'What does “Purim” refer to?',o:['Lots that were cast','A feast of bread','The king’s ring'],a:0}}),
E({id:'lotswife',cat:'beg',hid:1,t:'Lot’s Wife Looks Back',ref:'Genesis 18–19',era:'c. 2000 BC',series:'Genesis',v:'But his wife looked back from behind him, and she became a pillar of salt.',vr:'Genesis 19:26',s:'Abraham bargains with God to spare Sodom for the sake of just ten righteous people, but there aren’t ten. Angels drag Lot and his family out by the hand. They are told not to look back. Lot’s wife does.',h:['Abraham talked God down from 50 righteous people to 10 (18:32).','The Dead Sea area is full of salt formations. One pillar on Mount Sodom is nicknamed “Lot’s Wife.”','Jesus gave a three-word warning about the end times: “Remember Lot’s wife” (Luke 17:32).'],q:{q:'What did Lot’s wife become?',o:['A statue of gold','A pillar of salt','A tree'],a:1}}),
