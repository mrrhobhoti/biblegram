const RAR=[['common','Common','#b8b0c8',0],['rare','Rare','#5aa9ff',10],['epic','Epic','#c77dff',25],['legendary','Legendary','#ffd24d',60]];
function rollRarity(id){const x=byId(id);let r=Math.random()*100;if(x&&x.hid)r=Math.min(99.9,r+12);return r>=98?RAR[3]:r>=90?RAR[2]:r>=70?RAR[1]:RAR[0]}
function showDrop(id,R){const x=byId(id),e=$('#drop');if(!x)return;e.className='drop on '+R[0];e.innerHTML=`<small>${R[1]} scroll${R[3]?' · +'+R[3]+' pts':''}</small><b>${esc(x.t)}</b>`;clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),R[3]?3200:1700);
  if(R[3]){fx.burst(R[0]==='legendary'?150:R[0]==='epic'?95:55);fx.vib([20,30,20])}}
Object.keys(st.read).forEach(id=>{if(byId(id)&&st.col[id]==null)st.col[id]=RAR.indexOf(rollRarity(id))});save();
function albumHTML(){const cnt=[0,0,0,0];let n=0;Object.entries(st.col).forEach(([id,r])=>{if(byId(id)){cnt[r]++;n++}});
  return `<h3 class="sh">Scroll collection</h3><p class="sub">${n} of ${S.length} collected · ${RAR.map((r,i)=>`<span style="color:${r[2]}">${cnt[i]} ${r[1].toLowerCase()}</span>`).join(' · ')}</p><div class="alb">${S.map((x,i)=>{const r=st.col[x.id];return r==null?'<button disabled>?</button>':`<button data-go="${x.id}" style="background:${RAR[r][2]}44;border:1px solid ${RAR[r][2]}" title="${esc(x.t)}">${i+1}</button>`}).join('')}</div><p class="note" style="margin-top:6px">Each new story you read drops a scroll. Rarely told stories drop rarer ones.</p>`}

// Streak at risk (loss aversion, shown honestly)
const riskOn=()=>st.streak>0&&st.last===yday()&&todayN()===0;
const hoursLeft=()=>Math.max(1,Math.ceil((new Date().setHours(24,0,0,0)-Date.now())/36e5));
function riskHTML(){return riskOn()?`<div class="riskb"><b>Your ${st.streak}-day streak ends tonight</b><span>${hoursLeft()}h left. One story keeps it alive.</span><button data-goview="home">Read one now</button></div>`:''}

// Daily quests
const QDEF=[['Read 5 stories',5,l=>l.r||0],['Get 3 quiz answers right',3,l=>(l.q||0)+(l.x||0)],['Go deeper on 2 stories',2,l=>l.d||0]];
const questProg=()=>{const l=st.lg[today()]||{};return QDEF.map(([n,t,f])=>[n,Math.min(t,f(l)),t])};
function questsHTML(){const P=questProg(),all=P.every(p=>p[1]>=p[2]);
  return `<h2 class="sh">Daily quests</h2><div class="wk">${P.map(([n,v,t])=>`<div class="rd ${v>=t?'done':''}" style="cursor:default"><i>${v>=t?'✓':''}</i><span><b>${n}</b><small>${v}/${t}</small><div class="qbar"><em style="width:${v/t*100}%"></em></div></span></div>`).join('')}<p class="sub" style="margin:10px 0 0">${all?'All three done. +40 bonus claimed.':'Finish all three for +40 bonus points.'}</p></div>`}
function questCheck(){if(st.qd.d!==today())st.qd={d:today(),done:0};
  if(!st.qd.done&&questProg().every(p=>p[1]>=p[2])){st.qd.done=1;st.qdone=(st.qdone||0)+1;addPts(40);save();toast('Daily quests complete! +40');fx.burst(120);fx.vib([30,40,60])}
  top();if($('#v-today').classList.contains('on'))todayView()}

// Goal chest
const CHEST='<svg class="chestwob" viewBox="0 0 120 100" width="150" style="display:block;margin:6px auto"><rect x="14" y="44" width="92" height="46" rx="8" fill="#a8580a"/><path d="M14 44c0-22 20-34 46-34s46 12 46 34z" fill="#c8741a"/><rect x="14" y="48" width="92" height="8" fill="#f2c66d"/><rect x="52" y="50" width="16" height="22" rx="4" fill="#f2c66d"/><circle cx="60" cy="62" r="4" fill="#241a05"/></svg>';
function chestSheet(){if(!st.ch||st.ch.d!==today()||st.ch.o)return;openSheet(`<div class="chestc">${CHEST}<h3>Goal chest</h3><p class="sub">You hit ${GOAL} today. Open it to see what’s inside.</p><button class="btn" data-chest="1">Open chest</button><button class="btn ghost" data-close>Later</button></div>`)}
const chestRow=()=>st.ch&&st.ch.d===today()&&!st.ch.o?`<button class="row" data-chestopen="1"><span class="dot wd">★</span><span><b>Goal chest ready</b><small>Tap to open</small></span></button>`:'';
function chestReward(){const r=Math.random();if(r<.08&&!freezeFree())return {t:'A rest day restored',f:1,p:0};const p=r<.5?25+(Math.random()*25|0):r<.85?60+(Math.random()*40|0):150+(Math.random()*100|0);return {t:p>=150?'Jackpot!':p>=60?'Nice haul':'A small blessing',p}}

// Mystery scrolls in the feed
function mysteryHTML(){return `<section class="card fact" data-mystery="1" style="background:radial-gradient(120% 70% at 50% 30%,#5a4212,#0d0b1a 72%)"><div class="txt chestc"><div class="chips" style="justify-content:center"><span class="chip g">Mystery scroll</span></div>${CHEST}<h2>Something is waiting</h2><p class="story open">Break the seal to see what’s inside.</p><button class="btn" data-mys="1">Break the seal</button></div></section>`}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.chestopen){chestSheet();return}
  if(b.dataset.chest){if(!st.ch||st.ch.o)return;st.ch.o=1;const R=chestReward();if(R.f)st.fz='';if(R.p)addPts(R.p);save();top();
    $('#sheet').innerHTML=`<div class="grab"></div><div class="chestc"><h3 style="margin-top:20px">${R.t}</h3><p class="hello" style="font-size:48px;margin:8px 0">${R.p?'+'+R.p:'Rest day'}</p><p class="sub">${R.p?'points added':'Your weekly rest day is available again.'}</p><button class="btn" data-close>Nice</button></div>`;fx.burst(170);fx.vib([30,40,80]);if($('#v-today').classList.contains('on'))todayView();return}
  if(b.dataset.mys){const card=b.closest('.card');if(card.dataset.done)return;card.dataset.done=1;const r=Math.random(),un=S.filter(x=>x.hid&&!st.read[x.id]),extra=r>.82&&un.length,
    p=r<.6?10+(Math.random()*15|0):r<.9?30+(Math.random()*30|0):80+(Math.random()*70|0);addPts(p);save();top();
    card.querySelector('h2').textContent='+'+p+' points';card.querySelector('.story').textContent=extra?'And a rarely told story slipped out. Swipe up.':p>=80?'Jackpot!':'Keep scrolling. There are more out there.';
    const sv=card.querySelector('svg');if(sv)sv.classList.remove('chestwob');b.remove();
    if(extra){card.insertAdjacentHTML('afterend',cardHTML(pick(un)));observe()}
    fx.burst(p>=80?160:70);fx.vib(25);return}
});

render();top();show('today');


if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
}
</script>
</body>
</html>
